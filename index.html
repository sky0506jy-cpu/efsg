<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
  body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    display: block;
    width: min(960px, 100%);
    height: auto;
    margin: 20px auto;
    background: #101522;
  }
  button {
    padding: 12px 20px;
    margin: 5px;
    font-size: 18px;
  }
</style>
</head>
<body>
<h1>🏫 야자 탈출</h1>
<p>← → 이동 · Space 점프</p>
<canvas id="game" width="960" height="540"></canvas>
<button id="left">⬅ 왼쪽</button>
<button id="jump">점프</button>
<button id="right">오른쪽 ➡</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "school.png";

const sprite = new Image();
sprite.src = "character.png";

const player = {
  x: 100, y: 300,
  w: 64, h: 80,
  vx: 0, vy: 0,
  speed: 4,
  grounded: false,
  frame: 0,
  tick: 0,
  facing: 1
};

const keys = {};
const gravity = 0.55;
const groundY = 430;

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if ([" ", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  if ((e.code === "Space" || e.key === "ArrowUp")
      && player.grounded) {
    player.vy = -12;
    player.grounded = false;
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function holdButton(id, key) {
  const button = document.getElementById(id);
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    if (key === "jump" && player.grounded) {
      player.vy = -12;
      player.grounded = false;
    }
  });
  for (const event of ["pointerup", "pointerleave", "pointercancel"]) {
    button.addEventListener(event, () => {
      keys[key] = false;
    });
  }
}
holdButton("left", "arrowleft");
holdButton("right", "arrowright");
holdButton("jump", "jump");

function update() {
  player.vx = 0;

  if (keys["arrowleft"] || keys["a"]) {
    player.vx = -player.speed;
    player.facing = -1;
  }
  if (keys["arrowright"] || keys["d"]) {
    player.vx = player.speed;
    player.facing = 1;
  }

  player.x += player.vx;
  player.x = Math.max(0, Math.min(960 - player.w, player.x));

  player.vy += gravity;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  if (player.vx !== 0) {
    player.tick++;
    if (player.tick % 8 === 0) {
      player.frame = (player.frame + 1) % 8;
    }
  } else {
    player.frame = 0;
  }
}

function draw() {
  ctx.clearRect(0, 0, 960, 540);

  // 배경 이미지
  if (bg.complete && bg.naturalWidth > 0) {
    const scale = 960 / bg.naturalWidth;
    const height = bg.naturalHeight * scale;
    ctx.drawImage(bg, 0, 0, 960, height);
  } else {
    ctx.fillStyle = "#182238";
    ctx.fillRect(0, 0, 960, 540);
  }

  // 임시 바닥
  ctx.fillStyle = "#343b4d";
  ctx.fillRect(0, groundY, 960, 110);

  // 스프라이트 시트: 4열 x 2행
  if (sprite.complete && sprite.naturalWidth > 0) {
    const fw = sprite.naturalWidth / 4;
    const fh = sprite.naturalHeight / 2;
    const col = player.frame % 4;
    const row = Math.floor(player.frame / 4);

    ctx.save();

    if (player.facing === -1) {
      ctx.translate(player.x + player.w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(
        sprite,
        col * fw, row * fh, fw, fh,
        0, player.y, player.w, player.h
      );
    } else {
      ctx.drawImage(
        sprite,
        col * fw, row * fh, fw, fh,
        player.x, player.y, player.w, player.h
      );
    }

    ctx.restore();
  } else {
    ctx.fillStyle = "#f0c8a0";
    ctx.fillRect(player.x, player.y, player.w, player.h);
  }

  ctx.fillStyle = "white";
  ctx.font = "20px sans-serif";
  ctx.fillText("4층 - 야자 탈출 준비!", 20, 35);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
