<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}
canvas { display: block; width: 100vw; height: 100vh; }
#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
}
#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="help">← → / A D : 이동<br>Space / ↑ : 점프<br>⚠️ 장애물을 피해서 오른쪽 끝으로 가세요!</div>
<button id="nextFloor">다음 층(아래층)으로 내려가기 ▶</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
const assets = new Image(); // 장애물과 발판 이미지

school.src = "./school.png";
character.src = "./character.png";
assets.src = "./assets.png";

const keys = {};
let W = innerWidth, H = innerHeight;
let dpr = devicePixelRatio || 1;
let ready = false;
let finished = false;
let lastTime = 0;

// 4층에서 시작해서 1층으로 내려감
let currentFloor = 4;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

// 원본의 깔끔한 스케일과 비율 유지
const MAP_SCALE = 3.0;
const PLAYER_W = 100;
const PLAYER_H = 120;

const player = {
  x: 40,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14,
  onGround: true
};

let platforms = [];
let hazards = [];

// 층별 난이도에 맞추어 원래 맵 크기 안에서 발판과 장애물 배치
function fnMapGenerate() {
  platforms = [];
  hazards = [];

  // 층이 낮을수록 장애물과 발판이 많아짐 (난이도 상승)
  let count = 2 + (4 - currentFloor);
  let spacing = mapWidth / (count + 2);

  for (let i = 1; i <= count; i++) {
    let px = spacing * i + 100;
    let py = floorY - (130 + (i % 2) * 90);
    platforms.push({ x: px, y: py, w: Math.max(120, 220 - (4 - currentFloor) * 20), h: 40 });

    // 가시 장애물 배치
    if (i <= currentFloor || currentFloor <= 2) {
      hazards.push({ x: px + 40, y: floorY - 45, w: 50, h: 45 });
    }
  }

  // 추가 바닥 가시 장애물
  if (currentFloor <= 3) {
    hazards.push({ x: mapWidth * 0.45, y: floorY - 45, w: 60, h: 45 });
  }
  if (currentFloor <= 2) {
    hazards.push({ x: mapWidth * 0.7, y: floorY - 45, w: 60, h: 45 });
  }
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) return;

  // 원래 코드가 가지던 완벽한 맵 비율과 위치 복구
  mapWidth = Math.max(W, school.naturalWidth * MAP_SCALE);
  mapHeight = school.naturalHeight * MAP_SCALE;

  mapY = H * -0.98;
  floorY = H * 0.84;

  fnMapGenerate();

  player.y = floorY - player.h;
  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  cameraX = Math.max(0, Math.min(player.x - W * 0.3, mapWidth - W));
  ready = true;
}

school.onload = setup;
character.onload = setup;
assets.onload = setup;

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp"," ","a","A","d","D"].includes(e.key)) {
    e.preventDefault();
  }

  if (
    (e.code === "Space" || e.key === "ArrowUp") &&
    !keys[e.code] &&
    player.onGround &&
    !finished
  ) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.key] = true;
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

nextButton.addEventListener("click", () => {
  if (currentFloor > 1) {
    currentFloor--; // 4층 -> 3층 -> 2층 -> 1층
    resetPlayer();
    fnMapGenerate();
    nextButton.style.display = "none";
    finished = false;
    if (currentFloor === 1) {
      nextButton.textContent = "야자 탈출 완료! 🎉";
    }
  } else {
    currentFloor = 4;
    nextButton.textContent = "다음 층(아래층)으로 내려가기 ▶";
    resetPlayer();
    fnMapGenerate();
    nextButton.style.display = "none";
    finished = false;
  }
});

function resetPlayer() {
  player.x = 40;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  cameraX = 0;
}

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys.ArrowRight || keys.d || keys.D) {
    player.x += player.speed * factor;
    player.facing = 1;
  }
  if (keys.ArrowLeft || keys.a || keys.A) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  player.moving = Math.abs(player.x - oldX) > 0;

  // 중력과 점프
  if (!player.onGround) {
    player.velocityY += 0.65 * factor;
    player.y += player.velocityY * factor;

    if (player.y + player.h >= floorY) {
      player.y = floorY - player.h;
      player.velocityY = 0;
      player.onGround = true;
    }
  }

  // 발판 충돌 체크
  for (let plat of platforms) {
    if (
      player.x + player.w > plat.x + 10 &&
      player.x < plat.x + plat.w - 10 &&
      player.y + player.h >= plat.y &&
      player.y + player.h - player.velocityY * factor <= plat.y + 12 &&
      player.velocityY >= 0
    ) {
      player.y = plat.y - player.h;
      player.velocityY = 0;
      player.onGround = true;
    }
  }

  // 장애물(가시) 충돌 체크 (닿으면 리셋)
  for (let haz of hazards) {
    if (
      player.x + player.w > haz.x + 10 &&
      player.x < haz.x + haz.w - 10 &&
      player.y + player.h > haz.y + 10 &&
      player.y < haz.y + haz.h
    ) {
      resetPlayer();
      break;
    }
  }

  if (player.moving && player.onGround) {
    player.animTime += dt;
    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = player.x - W * 0.3;
  cameraX = Math.max(0, Math.min(cameraX, mapWidth - W));

  // 오른쪽 끝에 도달하면 클리어
  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("이미지를 불러오는 중...", 20, 60);
    return;
  }

  // 1. 원래 비율의 학교 배경 맵
  ctx.drawImage(
    school,
    -cameraX,
    mapY,
    school.naturalWidth * MAP_SCALE,
    mapHeight
  );

  // 2. 발판 (assets.png 이미지에서 파란색 블록 영역 크롭해서 반복 렌더링)
  // assets.png 내 발판 대략적 위치 좌표 예시 (필요시 시트 구조에 맞게 sx, sy 조정 가능)
  const srcTileX = 0, srcTileY = 0, srcTileW = 60, srcTileH = 20; 
  for (let plat of platforms) {
    if (assets.naturalWidth) {
      ctx.drawImage(assets, srcTileX, srcTileY, srcTileW, srcTileH, plat.x - cameraX, plat.y, plat.w, plat.h);
    } else {
      ctx.fillStyle = "#345c8c";
      ctx.fillRect(plat.x - cameraX, plat.y, plat.w, plat.h);
    }
  }

  // 3. 장애물 (assets.png 이미지에서 가시 영역 크롭)
  const srcSpikeX = 300, srcSpikeY = 0, srcSpikeW = 40, srcSpikeH = 40;
  for (let haz of hazards) {
    if (assets.naturalWidth) {
      ctx.drawImage(assets, srcSpikeX, srcSpikeY, srcSpikeW, srcSpikeH, haz.x - cameraX, haz.y, haz.w, haz.h);
    } else {
      ctx.fillStyle = "#d93838";
      ctx.fillRect(haz.x - cameraX, haz.y, haz.w, haz.h);
    }
  }

  // 4. 바닥
  ctx.fillStyle = "#343434";
  ctx.fillRect(0, floorY, W, H - floorY);

  // 5. 캐릭터 그리기
  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = player.frame * frameW;
  const sy = 0;

  ctx.save();

  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      0, player.y, player.w, player.h
    );
  } else {
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      player.x - cameraX, player.y, player.w, player.h
    );
  }

  ctx.restore();

  // 상단 층수 표시 UI
  ctx.fillStyle = "white";
  ctx.font = "bold 22px sans-serif";
  ctx.fillText(`🏫 야자 탈출 - ${currentFloor}층 복도`, 20, 60);

  if (finished) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "white";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    let msg = currentFloor > 1 ? `${currentFloor}층 복도 끝에 도착했다! 아래층으로!` : `🎉 1층 탈출 성공! 야자 탈출 완료!`;
    ctx.fillText(msg, W / 2, H / 2);
    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime ? time - lastTime : 16.67;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
