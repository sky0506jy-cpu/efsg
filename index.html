<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#help {
  position: fixed;
  top: 12px;

  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;

  pointer-events: none;
}

#nextFloor {
  display: none;
  position: fixed;
  top: 15px;

  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="help">
  ← → / A D : 이동<br>
  Space / ↑ : 점프<br>
  가시에 닿거나 발판에서 떨어지면 목숨 차감<br>
  목숨 3개 소진 시 처음부터 재시작
</div>

<button id="nextFloor">다음 층(아래층)으로 내려가기 ▶</button>
<canvas id="game"></canvas>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
const assets = new Image();

school.src = "./school.png";
character.src = "./character.png";
assets.src = "./assets.png";

const keys = Object.create(null);

let W = innerWidth;
let H = innerHeight;
let dpr = devicePixelRatio || 1;

let ready = false;
let finished = false;
let lastTime = 0;
let imageError = "";
let resetting = false;

let currentFloor = 4;
const MAX_LIVES = 3;
let lives = MAX_LIVES;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

const MAP_SCALE = 3.5;
const PLAYER_W = 82;
const PLAYER_H = 108;
const PLATFORM_HEIGHT = 30;

const GRAVITY = 0.72;
const JUMP_POWER = 15;
const MOVE_SPEED = 5;

// 난이도가 올라갈수록 간격과 장애물이 증가.
// 모든 층에서 발판 사이 간격은 점프로 도달할 수 있는 범위 안에 둠.
const FLOOR_SETTINGS = {
  4: {
    minGap: 82,
    maxGap: 108,
    minWidth: 130,
    maxWidth: 160,
    heightChange: 12,
    groundSpacing: [280, 350],
    platformHazardChance: 0.10
  },
  3: {
    minGap: 95,
    maxGap: 120,
    minWidth: 120,
    maxWidth: 150,
    heightChange: 18,
    groundSpacing: [245, 315],
    platformHazardChance: 0.16
  },
  2: {
    minGap: 105,
    maxGap: 130,
    minWidth: 115,
    maxWidth: 140,
    heightChange: 22,
    groundSpacing: [215, 280],
    platformHazardChance: 0.22
  },
  1: {
    minGap: 112,
    maxGap: 138,
    minWidth: 110,
    maxWidth: 135,
    heightChange: 25,
    groundSpacing: [190, 250],
    platformHazardChance: 0.28
  }
};

const player = {
  x: 35,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: MOVE_SPEED,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: JUMP_POWER,
  onGround: false
};

let platforms = [];
let hazards = [];

function randomInt(min, max) {
  return Math.floor(min + Math.random() * (max - min + 1));
}

function getSettings() {
  return FLOOR_SETTINGS[currentFloor];
}

function fnMapGenerate() {
  platforms = [];
  hazards = [];

  if (!mapWidth || !floorY) return;

  const settings = getSettings();
  const finishX = Math.max(400, mapWidth - 230);

  platforms.push({
    x: 0,
    y: floorY,
    w: 235,
    h: PLATFORM_HEIGHT,
    type: "start"
  });

  // 출구 발판
  const finishPlatform = {
    x: finishX,
    y: floorY - 20,
    w: mapWidth - finishX,
    h: PLATFORM_HEIGHT,
    type: "finish"
  };

  // 이론상 점프 거리에 안전 여유를 적용
  const jumpDistance =
    player.speed * player.jumpPower * 2 / GRAVITY;

  const safeGap = Math.min(
    settings.maxGap,
    Math.floor(jumpDistance * 0.65)
  );

  // 중간 발판 생성
  let lastX = 235;
  let lastY = floorY;
  let attempts = 0;

  while (lastX + 100 < finishX && attempts < 2000) {
    attempts++;

    const gap = Math.min(
      randomInt(settings.minGap, safeGap),
      finishX - lastX - 100
    );

    if (gap < 0) break;

    const px = lastX + gap;
    const pw = randomInt(settings.minWidth, settings.maxWidth);

    const verticalChange = randomInt(
      -settings.heightChange,
      settings.heightChange
    );

    const py = Math.max(
      floorY - 90,
      Math.min(floorY, lastY + verticalChange)
    );

    const width = Math.min(pw, finishX - px);

    platforms.push({
      x: px,
      y: py,
      w: width,
      h: PLATFORM_HEIGHT,
      type: Math.random() < 0.3 ? "small" : "normal"
    });

    lastX = px + width;
    lastY = py;
  }

  // 출구 직전 간격만 보충
  platforms.sort((a, b) => a.x - b.x);

  let lastPlatform = platforms[platforms.length - 1];

  while (
    lastPlatform &&
    finishPlatform.x - (lastPlatform.x + lastPlatform.w) > safeGap
  ) {
    const px = lastPlatform.x + lastPlatform.w + safeGap * 0.75;

    const bridge = {
      x: px,
      y: Math.max(floorY - 75, Math.min(floorY, lastPlatform.y)),
      w: 105,
      h: PLATFORM_HEIGHT,
      type: "normal"
    };

    platforms.push(bridge);
    lastPlatform = bridge;
  }

  platforms.push(finishPlatform);
  platforms.sort((a, b) => a.x - b.x);

  // 실제 인접 발판 간격을 검사하고 필요한 곳만 보정
  const fixed = [];

  for (const p of platforms) {
    if (!fixed.length) {
      fixed.push(p);
      continue;
    }

    const prev = fixed[fixed.length - 1];
    const gap = p.x - (prev.x + prev.w);

    if (gap > safeGap) {
      const count = Math.ceil(gap / safeGap);

      for (let i = 1; i < count; i++) {
        const px =
          prev.x + prev.w + (gap / count) * i - 40;

        fixed.push({
          x: px,
          y: prev.y,
          w: 90,
          h: PLATFORM_HEIGHT,
          type: "normal"
        });
      }
    }

    fixed.push(p);
  }

  platforms = fixed.sort((a, b) => a.x - b.x);

  // 바닥 가시: 발판과 겹치는 곳에는 생성하지 않음
  let hx = 290;
  const hazardEnd = finishX - 145;

  while (hx < hazardEnd) {
    const hw = randomInt(36, 48);
    const hh = randomInt(28, 38);

    const nearPlatform = platforms.some(p =>
      hx + hw > p.x - 30 &&
      hx < p.x + p.w + 30
    );

    if (!nearPlatform) {
      hazards.push({
        x: hx,
        y: floorY - hh,
        w: hw,
        h: hh,
        type: "spikes"
      });
    }

    hx += randomInt(
      settings.groundSpacing[0],
      settings.groundSpacing[1]
    );
  }

  // 발판 위 가시:
  // 넓은 발판에만 생성하고, 한 발판에는 최대 하나만 배치.
  // 가시 좌우에 플레이어가 지나갈 공간을 남김.
  for (const p of platforms) {
    if (
      p.type === "start" ||
      p.type === "finish" ||
      p.w < 140 ||
      Math.random() > settings.platformHazardChance
    ) {
      continue;
    }

    const hw = 24;
    const margin = Math.max(35, player.w * 0.45);
    const available = p.w - hw - margin * 2;

    if (available < 1) continue;

    // 가시는 발판 중앙 부근에 두어 양쪽으로 피할 수 있게 함
    const hx = p.x + margin +
      randomInt(0, Math.floor(available));

    hazards.push({
      x: hx,
      y: p.y - 25,
      w: hw,
      h: 25,
      type: "platformSpike"
    });
  }

  hazards.sort((a, b) => a.x - b.x);
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) {
    ready = false;
    return;
  }

  mapWidth = Math.max(
    W + 1,
    school.naturalWidth * MAP_SCALE
  );

  mapHeight = school.naturalHeight * MAP_SCALE;
  mapY = (H - mapHeight) / 2 + PLAYER_H * 2;

  const backgroundFloorY = mapY + 392 * MAP_SCALE;
  floorY = Math.min(backgroundFloorY, H - PLAYER_H - 10);

  fnMapGenerate();
  resetPlayer();

  ready = true;
  imageError = "";
}

school.onload = setup;
character.onload = setup;

school.onerror = () => {
  imageError = "school.png 파일을 불러오지 못했습니다. 파일 이름과 위치를 확인하세요.";
  ready = false;
};

character.onerror = () => {
  imageError = "character.png 파일을 불러오지 못했습니다. 파일 이름과 위치를 확인하세요.";
  ready = false;
};

assets.onerror = () => {
  console.error("assets.png를 불러오지 못했습니다. 기본 도형으로 표시합니다.");
};

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (
    ["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key) ||
    ["KeyA", "KeyD", "Space"].includes(e.code)
  ) {
    e.preventDefault();
  }

  const jumpPressed =
    e.code === "Space" || e.key === "ArrowUp";

  if (
    jumpPressed &&
    !keys[e.code] &&
    !keys[e.key] &&
    player.onGround &&
    !finished &&
    ready
  ) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.key] = true;
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

function resetPlayer() {
  player.x = 35;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  player.animTime = 0;
  player.moving = false;
  cameraX = 0;
}

function restartGame() {
  currentFloor = 4;
  lives = MAX_LIVES;
  finished = false;
  resetting = false;

  nextButton.style.display = "none";
  nextButton.textContent = "다음 층(아래층)으로 내려가기 ▶";

  fnMapGenerate();
  resetPlayer();
}

function loseLife() {
  if (finished || resetting) return;

  resetting = true;
  lives--;

  if (lives <= 0) {
    restartGame();
    return;
  }

  fnMapGenerate();
  resetPlayer();
  resetting = false;
}

nextButton.addEventListener("click", () => {
  if (currentFloor > 1) {
    currentFloor--;
    lives = MAX_LIVES;
    finished = false;

    nextButton.style.display = "none";
    fnMapGenerate();
    resetPlayer();
  } else {
    restartGame();
  }
});

function intersects(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

// 가시 모양에 맞춘 좁은 충돌 판정.
// 그림의 전체 사각형이 아니라 중앙의 뾰족한 부분만 판정한다.
function getHazardHitbox(h) {
  if (h.type === "platformSpike") {
    return {
      x: h.x + h.w * 0.30,
      y: h.y + h.h * 0.38,
      w: h.w * 0.40,
      h: h.h * 0.62
    };
  }

  return {
    x: h.x + h.w * 0.20,
    y: h.y + h.h * 0.35,
    w: h.w * 0.60,
    h: h.h * 0.65
  };
}

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys.ArrowRight || keys.d || keys.D || keys.KeyD) {
    player.x += player.speed * factor;
    player.facing = 1;
  }

  if (keys.ArrowLeft || keys.a || keys.A || keys.KeyA) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(
    0,
    Math.min(player.x, mapWidth - player.w)
  );

  player.moving = Math.abs(player.x - oldX) > 0;

  const previousBottom = player.y + player.h;

  player.onGround = false;
  player.velocityY += GRAVITY * factor;
  player.y += player.velocityY * factor;

  // 위에서 내려올 때만 발판에 착지
  if (player.velocityY >= 0) {
    for (const p of platforms) {
      const overlapX =
        player.x + player.w - 8 > p.x &&
        player.x + 8 < p.x + p.w;

      const crossedTop =
        previousBottom <= p.y + 10 &&
        player.y + player.h >= p.y;

      if (overlapX && crossedTop) {
        player.y = p.y - player.h;
        player.velocityY = 0;
        player.onGround = true;
        break;
      }
    }
  }

  // 발판을 놓치면 목숨 차감
  if (player.y + player.h >= floorY && !player.onGround) {
    loseLife();
    return;
  }

  if (player.y > H + 100) {
    loseLife();
    return;
  }

  const playerHitbox = {
    x: player.x + 18,
    y: player.y + 15,
    w: player.w - 36,
    h: player.h - 25
  };

  for (const h of hazards) {
    const hazardHitbox = getHazardHitbox(h);

    if (intersects(playerHitbox, hazardHitbox)) {
      loseLife();
      return;
    }
  }

  if (player.moving && player.onGround) {
    player.animTime += dt;

    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = Math.max(
    0,
    Math.min(player.x - W * 0.25, mapWidth - W)
  );

  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
    nextButton.textContent = currentFloor > 1
      ? "다음 층(아래층)으로 내려가기 ▶"
      : "탈출 완료! 처음부터 다시 ▶";
  }
}

function drawPlatform(p) {
  const x = p.x - cameraX;
