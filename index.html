<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
  pointer-events: none;
}

#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="help">
  ← → / A D : 이동<br>
  Space / ↑ : 점프<br>
  장애물에 닿거나 바닥으로 떨어지면 목숨 차감<br>
  목숨 3개 소진 시 처음부터 재시작
</div>

<button id="nextFloor">다음 층(아래층)으로 내려가기 ▶</button>
<canvas id="game"></canvas>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
const assets = new Image();

school.src = "./school.png";
character.src = "./character.png";
assets.src = "./assets.png";

const keys = Object.create(null);

let W = innerWidth;
let H = innerHeight;
let dpr = devicePixelRatio || 1;

let ready = false;
let finished = false;
let lastTime = 0;
let imageError = "";
let resetting = false;

let currentFloor = 4;
const MAX_LIVES = 3;
let lives = MAX_LIVES;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

const MAP_SCALE = 3.5;
const PLAYER_W = 82;
const PLAYER_H = 108;
const PLATFORM_HEIGHT = 30;

// 점프 가능한 범위보다 충분히 짧게 발판 간격을 제한
const MAX_JUMP_GAP = 100;
const MAX_SAFE_GAP = 82;
const MAX_PLATFORM_RISE = 35;
const MIN_PLATFORM_GAP = 48;

const player = {
  x: 35,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14,
  onGround: false
};

let platforms = [];
let hazards = [];

function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

function randomInt(min, max) {
  return Math.floor(randomRange(min, max + 1));
}

// 층이 낮아질수록 난이도가 증가
function getDifficulty() {
  return 4 - currentFloor;
}

// 시작 발판과 출구 발판 사이에
// 점프로 도달할 수 있는 발판을 차례대로 배치
function generatePlatforms(finishX) {
  const result = [];

  result.push({
    x: 0,
    y: floorY,
    w: 235,
    h: PLATFORM_HEIGHT,
    type: "start"
  });

  let lastX = 235;
  let lastY = floorY;
  const difficulty = getDifficulty();

  while (lastX < finishX) {
    const remaining = finishX - lastX;

    // 마지막 구간도 안전한 거리로 연결
    if (remaining <= MAX_SAFE_GAP + 100) {
      const gap = Math.max(
        30,
        Math.min(MAX_SAFE_GAP, remaining - 95)
      );

      const px = lastX + gap;
      const pw = Math.max(100, finishX - px);

      if (px + pw >= finishX + 180) {
        result.push({
          x: px,
          y: floorY - 35,
          w: Math.max(100, finishX - px),
          h: PLATFORM_HEIGHT,
          type: "normal"
        });
        break;
      }

      result.push({
        x: px,
        y: Math.max(floorY - 85, Math.min(floorY, lastY)),
        w: Math.max(100, finishX - px),
        h: PLATFORM_HEIGHT,
        type: "normal"
      });
      break;
    }

    // 난이도가 높을수록 간격이 조금 넓어지지만
    // 점프로 이동할 수 있는 범위를 넘지 않음
    const minGap = 45 + difficulty * 5;
    const maxGap = Math.min(
      MAX_SAFE_GAP,
      62 + difficulty * 6
    );

    const gap = randomInt(minGap, maxGap);
    const px = lastX + gap;

    // 높이 차이도 점프 가능한 범위로 제한
    const verticalChange = randomInt(
      -15 - difficulty * 2,
      12 + difficulty * 2
    );

    let py = lastY + verticalChange;
    py = Math.max(floorY - 95, Math.min(floorY, py));

    const pw = randomInt(125, 165);

    result.push({
      x: px,
      y: py,
      w: pw,
      h: PLATFORM_HEIGHT,
      type: Math.random() < 0.25 ? "small" : "normal"
    });

    lastX = px + pw;
    lastY = py;

    if (result.length > 2000) break;
  }

  // 출구 발판을 넓게 만들어 마지막 착지를 쉽게 함
  result.push({
    x: finishX,
    y: floorY - 25,
    w: Math.max(200, mapWidth - finishX),
    h: PLATFORM_HEIGHT,
    type: "finish"
  });

  result.sort((a, b) => a.x - b.x);

  // 겹치거나 지나치게 멀어진 발판 사이를 보정
  const fixed = [];

  for (const p of result) {
    if (fixed.length === 0) {
      fixed.push(p);
      continue;
    }

    const prev = fixed[fixed.length - 1];
    const gap = p.x - (prev.x + prev.w);

    if (gap > MAX_SAFE_GAP) {
      const count = Math.ceil(gap / MAX_SAFE_GAP);

      for (let i = 1; i < count; i++) {
        const px =
          prev.x + prev.w + (gap / count) * i - 45;

        fixed.push({
          x: px,
          y: prev.y,
          w: 100,
          h: PLATFORM_HEIGHT,
          type: "normal"
        });
      }
    }

    fixed.push(p);
  }

  fixed.sort((a, b) => a.x - b.x);
  return fixed;
}

function fnMapGenerate() {
  platforms = [];
  hazards = [];

  if (!mapWidth || !floorY) return;

  const finishX = Math.max(300, mapWidth - 230);
  platforms = generatePlatforms(finishX);

  const difficulty = getDifficulty();

  // 시작과 출구 근처는 장애물 없이 안전하게 유지
  const hazardStart = 290;
  const hazardEnd = finishX - 140;

  // 아래층일수록 바닥 장애물 사이 간격을 줄임
  let hx = hazardStart + randomInt(30, 70);

  const hazardSpacing = [
    [300, 390], // 4층
    [250, 335], // 3층
    [210, 290], // 2층
    [175, 250]  // 1층
  ][difficulty];

  while (hx < hazardEnd) {
    const hw = randomInt(
      35 + difficulty * 2,
      48 + difficulty * 3
    );
    const hh = randomInt(28, 40 + difficulty * 2);

    // 발판 주변의 착지 공간은 막지 않음
    const nearPlatform = platforms.some(p =>
      hx + hw > p.x - 32 &&
      hx < p.x + p.w + 32
    );

    if (!nearPlatform) {
      hazards.push({
        x: hx,
        y: floorY - hh,
        w: hw,
        h: hh,
        type: "spikes"
      });
    }

    hx += randomInt(
      hazardSpacing[0],
      hazardSpacing[1]
    );
  }

  // 발판 위 가시: 아래층일수록 등장 확률 증가
  const platformHazardChance = [0.08, 0.16, 0.25, 0.34][difficulty];

  for (const p of platforms) {
    if (
      p.type === "start" ||
      p.type === "finish" ||
      p.w < 145 ||
      Math.random() > platformHazardChance
    ) {
      continue;
    }

    // 가시를 발판 중앙에만 배치하고
    // 양쪽에 착지할 수 있는 공간을 남김
    const hw = randomInt(22, 30);
    const margin = 30;
    const available = p.w - hw - margin * 2;

    if (available <= 0) continue;

    const hx = p.x + margin +
      randomInt(0, Math.floor(available));

    hazards.push({
      x: hx,
      y: p.y - 27,
      w: hw,
      h: 27,
      type: "platformSpike"
    });
  }

  platforms.sort((a, b) => a.x - b.x);
  hazards.sort((a, b) => a.x - b.x);
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) {
    ready = false;
    return;
  }

  mapWidth = Math.max(
    W + 1,
    school.naturalWidth * MAP_SCALE
  );

  mapHeight = school.naturalHeight * MAP_SCALE;
  mapY = (H - mapHeight) / 2 + PLAYER_H * 2;

  const backgroundFloorY = mapY + 392 * MAP_SCALE;
  floorY = Math.min(backgroundFloorY, H - PLAYER_H - 10);

  fnMapGenerate();
  resetPlayer();

  ready = true;
  imageError = "";
}

school.onload = setup;
character.onload = setup;

school.onerror = () => {
  imageError = "school.png 파일을 불러오지 못했습니다. 파일 이름과 위치를 확인하세요.";
  ready = false;
};

character.onerror = () => {
  imageError = "character.png 파일을 불러오지 못했습니다. 파일 이름과 위치를 확인하세요.";
  ready = false;
};

assets.onerror = () => {
  console.error("assets.png를 불러오지 못했습니다. 기본 도형으로 표시합니다.");
};

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (
    ["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key) ||
    ["KeyA", "KeyD", "Space"].includes(e.code)
  ) {
    e.preventDefault();
  }

  const jumpPressed =
    e.code === "Space" || e.key === "ArrowUp";

  if (
    jumpPressed &&
    !keys[e.code] &&
    !keys[e.key] &&
    player.onGround &&
    !finished &&
    ready
  ) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.key] = true;
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

function resetPlayer() {
  player.x = 35;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  player.animTime = 0;
  player.moving = false;
  cameraX = 0;
}

function restartGame() {
  currentFloor = 4;
  lives = MAX_LIVES;
  finished = false;
  resetting = false;

  nextButton.style.display = "none";
  nextButton.textContent = "다음 층(아래층)으로 내려가기 ▶";

  fnMapGenerate();
  resetPlayer();
}

function loseLife() {
  if (finished || resetting) return;

  resetting = true;
  lives--;

  if (lives <= 0) {
    restartGame();
    return;
  }

  // 목숨을 잃어도 같은 층에서 다시 도전
  fnMapGenerate();
  resetPlayer();
  resetting = false;
}

nextButton.addEventListener("click", () => {
  if (currentFloor > 1) {
    currentFloor--;
    lives = MAX_LIVES;
    finished = false;

    nextButton.style.display = "none";
    fnMapGenerate();
    resetPlayer();
  } else {
    restartGame();
  }
});

function intersects(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys.ArrowRight || keys.d || keys.D || keys.KeyD) {
    player.x += player.speed * factor;
    player.facing = 1;
  }

  if (keys.ArrowLeft || keys.a || keys.A || keys.KeyA) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(
    0,
    Math.min(player.x, mapWidth - player.w)
  );

  player.moving = Math.abs(player.x - oldX) > 0;

  const previousBottom = player.y + player.h;

  player.onGround = false;
  player.velocityY += 0.65 * factor;
  player.y += player.velocityY * factor;

  // 발판 위로 내려올 때 착지
  if (player.velocityY >= 0) {
    for (const p of platforms) {
      const overlapX =
        player.x + player.w - 8 > p.x &&
        player.x + 8 < p.x + p.w;

      const crossedTop =
        previousBottom <= p.y + 10 &&
        player.y + player.h >= p.y;

      if (overlapX && crossedTop) {
        player.y = p.y - player.h;
        player.velocityY = 0;
        player.onGround = true;
        break;
      }
    }
  }

  // 발판을 놓치면 목숨 차감
  if (player.y + player.h >= floorY && !player.onGround) {
    loseLife();
    return;
  }

  if (player.y > H + 100) {
    loseLife();
    return;
  }

  const hitbox = {
    x: player.x + 12,
    y: player.y + 12,
    w: player.w - 24,
    h: player.h - 18
  };

  for (const h of hazards) {
    const hazardBox = {
      x: h.x + 5,
      y: h.y + 5,
      w: Math.max(8, h.w - 10),
      h: Math.max(8, h.h - 5)
    };

    if (intersects(hitbox, hazardBox)) {
      loseLife();
      return;
    }
  }

  if (player.moving && player.onGround) {
    player.animTime += dt;

    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = Math.max(
    0,
    Math.min(player.x - W * 0.25, mapWidth - W)
  );

  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
    nextButton.textContent = currentFloor > 1
      ? "다음 층(아래층)으로 내려가기 ▶"
      : "탈출 완료! 처음부터 다시 ▶";
  }
}

function drawPlatform(p) {
  const x = p.x - cameraX;

  if (assets.complete && assets.naturalWidth > 0) {
    ctx.drawImage(
      assets,
      16, 108, 294, 72,
      x, p.y, p.w, p.h
    );
  } else {
    ctx.fillStyle = p.type === "start"
      ? "#526d8e"
      : p.type === "small"
        ? "#476a9f"
        : "#3b5b92";

    ctx.fillRect(x, p.y, p.w, p.h);

    ctx.fillStyle = "#8ebaff";
    ctx.fillRect(x, p.y, p.w, 5);

    ctx.strokeStyle = "#223a61";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, p.y, p.w, p.h);
  }
}

function drawHazard(h) {
  const x = h.x - cameraX;

  if (h.type === "platformSpike") {
    ctx.fillStyle = "#ff654f";
    ctx.beginPath();
    ctx.moveTo(x, h.y + h.h);
    ctx.lineTo(x + h.w * 0.5, h.y);
    ctx.lineTo(x + h.w, h.y + h.h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffb5a7";
    ctx.beginPath();
    ctx.moveTo(x + h.w * 0.35, h.y + h.h * 0.65);
    ctx.lineTo(x + h.w * 0.5, h.y + h.h * 0.2);
    ctx.lineTo(x + h.w * 0.65, h.y + h.h * 0.65);
    ctx.closePath();
    ctx.fill();

    return;
  }

  if (assets.complete && assets.naturalWidth > 0) {
    ctx.drawImage(
      assets,
      1260, 275, 110, 70,
      x, h.y, h.w, h.h
    );
  } else {
    ctx.fillStyle = "#e53945";
    ctx.beginPath();

    const spikeCount = Math.max(2, Math.floor(h.w / 18));
    const spikeWidth = h.w / spikeCount;

    ctx.moveTo(x, h.y + h.h);

    for (let i = 0; i < spikeCount; i++) {
      ctx.lineTo(
        x + i * spikeWidth + spikeWidth / 2,
        h.y
      );
      ctx.lineTo(
        x + (i + 1) * spikeWidth,
        h.y + h.h
      );
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ff8b8b";
    ctx.fillRect(x, h.y + h.h - 5, h.w, 5);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(
      imageError || "이미지를 불러오는 중...",
      20,
      60
    );
    return;
  }

  if (school.complete && school.naturalWidth > 0) {
    ctx.drawImage(
      school,
      -cameraX,
      mapY,
      school.naturalWidth * MAP_SCALE,
      mapHeight
    );
  }

  for (const p of platforms) {
    if (
      p.x - cameraX < W + 150 &&
      p.x - cameraX + p.w > -150
    ) {
      drawPlatform(p);
    }
  }

  for (const h of hazards) {
    if (
      h.x - cameraX < W + 150 &&
      h.x - cameraX + h.w > -150
    ) {
      drawHazard(h);
    }
  }

  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = (player.frame % 4) * frameW;
  const sy = player.frame >= 4 ? frameH : 0;

  ctx.save();

  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      0, player.y, player.w, player.h
    );
  } else {
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      player.x - cameraX, player.y, player.w, player.h
    );
  }

  ctx.restore();

  ctx.textAlign = "left";
  ctx.fillStyle = "white";
  ctx.font = "bold 22px sans-serif";
  ctx.fillText(`🏫 야자 탈출 - ${currentFloor}층 복도`, 20, 125);

  ctx.font = "bold 25px sans-serif";
  ctx.fillStyle = "#ff5b70";
  ctx.fillText("❤️".repeat(lives), 20, 160);

  ctx.fillStyle = "white";
  ctx.font = "16px sans-serif";
  ctx.fillText(`목숨 ${lives}/${MAX_LIVES}`, 20, 185);

  const difficultyNames = [
    "쉬움",
    "보통",
    "어려움",
    "매우 어려움"
  ];

  ctx.fillStyle = "#ffd34e";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText(
    `난이도: ${difficultyNames[getDifficulty()]}`,
    20,
    210
  );

  if (finished) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "white";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";

    ctx.fillText(
      currentFloor > 1
        ? `${currentFloor}층 복도 끝에 도착했다! 아래층으로!`
        : "🎉 1층 탈출 성공! 야자 탈출 완료!",
      W / 2,
      H / 2
    );

    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime
    ? Math.min(time - lastTime, 50)
    : 16.67;

  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
