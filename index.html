<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출 - 발판과 장애물 스테이지</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}
canvas { display: block; width: 100vw; height: 100vh; }
#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
}
#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="help">← → / A D : 이동<br>Space / ↑ : 점프<br>⚠️ 가시 장애물을 피하세요!</div>
<button id="nextFloor">다음 층으로 ▶</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
const tileSheet = new Image(); // 장애물 및 발판 스프라이트 시트

school.src = "./school.png";
character.src = "./character.png";
tileSheet.src = "./장애물과 발판.jpg"; // 업로드해주신 이미지 파일명

const keys = {};
let W = innerWidth, H = innerHeight;
let dpr = devicePixelRatio || 1;
let ready = false;
let finished = false;
let lastTime = 0;
let currentFloor = 1;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

const MAP_SCALE = 3.0;
const PLAYER_W = 80;
const PLAYER_H = 100;

const player = {
  x: 40,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14,
  onGround: false
};

// 🗺️ 공중 발판 목록 (x, y, w, h) - 캔버스 비율 기준으로 배치하거나 맵 좌표계로 배치 가능
let platforms = [];
// ⚠️ 장애물 목록 (x, y, w, h, type)
let hazards = [];

function initMapObjects() {
  // 맵 크기에 비례해서 발판과 장애물 배치 예시
  platforms = [
    { x: 300, y: floorY - 120, w: 220, h: 30 },
    { x: 650, y: floorY - 220, w: 200, h: 30 },
    { x: 1000, y: floorY - 150, w: 250, h: 30 },
  ];

  hazards = [
    { x: 500, y: floorY - 40, w: 80, h: 40, type: 'spike' },
    { x: 850, y: floorY - 40, w: 80, h: 40, type: 'spike' }
  ];
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) return;

  mapWidth = Math.max(W * 2, school.naturalWidth * MAP_SCALE); // 맵을 좀 더 넉넉하게
  mapHeight = school.naturalHeight * MAP_SCALE;

  mapY = H * -0.98;
  floorY = H * 0.84;
  
  initMapObjects();

  player.y = floorY - player.h;
  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  cameraX = Math.max(0, Math.min(player.x - W * 0.3, mapWidth - W));
  ready = true;
}

school.onload = setup;
character.onload = setup;
tileSheet.onload = setup;

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", " ", "a", "A", "d", "D"].includes(e.key)) {
    e.preventDefault();
  }

  if ((e.code === "Space" || e.key === "ArrowUp") && player.onGround && !finished) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.code] = true;
  keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
  keys[e.code] = false;
  keys[e.key.toLowerCase()] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

nextButton.addEventListener("click", () => {
  currentFloor++;
  resetPlayer();
  initMapObjects();
  nextButton.style.display = "none";
  finished = false;
});

function resetPlayer() {
  player.x = 40;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  cameraX = 0;
}

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys["ArrowRight"] || keys["d"]) {
    player.x += player.speed * factor;
    player.facing = 1;
  }
  if (keys["ArrowLeft"] || keys["a"]) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  player.moving = Math.abs(player.x - oldX) > 0;

  // 중력 적용
  player.velocityY += 0.65 * factor;
  player.y += player.velocityY * factor;

  // 바닥 충돌 체크
  player.onGround = false;
  if (player.y + player.h >= floorY) {
    player.y = floorY - player.h;
    player.velocityY = 0;
    player.onGround = true;
  }

  // 발판(Platforms) 충돌 체크 (위에서 아래로 떨어질 때만 밟히도록)
  for (let plat of platforms) {
    // 플레이어의 이전 y위치 혹은 발 부근과 발판 상단과의 판정
    if (
      player.x + player.w > plat.x &&
      player.x < plat.x + plat.w &&
      player.y + player.h >= plat.y &&
      player.y + player.h - player.velocityY * factor <= plat.y + 10 &&
      player.velocityY >= 0
    ) {
      player.y = plat.y - player.h;
      player.velocityY = 0;
      player.onGround = true;
    }
  }

  // 장애물(Hazards) 충돌 체크 (가시에 닿으면 처음으로 리셋)
  for (let haz of hazards) {
    if (
      player.x + player.w > haz.x + 10 &&
      player.x < haz.x + haz.w - 10 &&
      player.y + player.h > haz.y + 10 &&
      player.y < haz.y + haz.h
    - player.y < haz.y + haz.h
    ) {
      // 앗! 가시에 찔림
      resetPlayer();
      break;
    }
  }

  // 애니메이션 처리
  if (player.moving && player.onGround) {
    player.animTime += dt;
    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = player.x - W * 0.3;
  cameraX = Math.max(0, Math.min(cameraX, mapWidth - W));

  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("게임을 준비 중입니다...", 20, 60);
    return;
  }

  // 학교 배경 복도 그리기
  ctx.drawImage(
    school,
    -cameraX,
    mapY,
    school.naturalWidth * MAP_SCALE,
    mapHeight
  );

  // 공중 발판들 그리기 (스프라이트 시트가 있다면 시트에서 잘라 그려도 되고, 임시 박스로 그려도 됩니다)
  ctx.fillStyle = "#3b5b92";
  for (let plat of platforms) {
    ctx.fillRect(plat.x - cameraX, plat.y, plat.w, plat.h);
    // 테두리 디테일
    ctx.strokeStyle = "#6fa1e3";
    ctx.lineWidth = 3;
    ctx.strokeRect(plat.x - cameraX, plat.y, plat.w, plat.h);
  }

  // 장애물(가시 등) 그리기
  ctx.fillStyle = "#d93838";
  for (let haz of hazards) {
    ctx.fillRect(haz.x - cameraX, haz.y, haz.w, haz.h);
  }

  // 바닥
  ctx.fillStyle = "#343434";
  ctx.fillRect(0, floorY, W, H - floorY);

  // 플레이어 그리기
  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = player.frame * frameW;
  const sy = 0;

  ctx.save();
  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(character, sx, sy, frameW, frameH, 0, player.y, player.w, player.h);
  } else {
    ctx.drawImage(character, sx, sy, frameW, frameH, player.x - cameraX, player.y, player.w, player.h);
  }
  ctx.restore();

  // 상단 UI 텍스트
  ctx.fillStyle = "white";
  ctx.font = "bold 20px sans-serif";
  ctx.fillText(`${currentFloor}층 복도`, 20, 60);

  if (finished) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "white";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`${currentFloor}층 복도 탈출 성공!`, W / 2, H / 2);
    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime ? time - lastTime : 16.67;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
