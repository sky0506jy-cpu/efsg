<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
  body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }

  canvas {
    display: block;
    width: min(960px, 100%);
    height: auto;
    margin: 20px auto;
    background: #101522;
  }

  button {
    padding: 12px 20px;
    margin: 5px;
    font-size: 18px;
    touch-action: none;
  }
</style>
</head>
<body>

<h1>🏫 야자 탈출</h1>
<p>← → 이동 · Space 점프</p>

<canvas id="game" width="960" height="540"></canvas>

<button id="left">⬅ 왼쪽</button>
<button id="jump">점프</button>
<button id="right">오른쪽 ➡</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "school.png";

const sprite = new Image();
sprite.src = "character.png";

// 맵 크기
const worldWidth = 4000;
const groundY = 450;
const gravity = 0.55;

// 캐릭터
const player = {
  x: 50,
  y: 300,
  w: 100,
  h: 115,
  vx: 0,
  vy: 0,
  speed: 4,
  grounded: false,
  frame: 0,
  tick: 0,
  facing: 1
};

const keys = {};
let cameraX = 0;

// 키보드 조작
window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  if ([" ", "arrowleft", "arrowright"].includes(key)) {
    e.preventDefault();
  }

  if (
    (e.code === "Space" || e.key === "ArrowUp") &&
    player.grounded
  ) {
    player.vy = -12;
    player.grounded = false;
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// 화면 버튼 조작
function holdButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    keys[key] = true;

    if (key === "jump" && player.grounded) {
      player.vy = -12;
      player.grounded = false;
    }
  });

  function release() {
    keys[key] = false;
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

holdButton("left", "arrowleft");
holdButton("right", "arrowright");
holdButton("jump", "jump");

// 게임 업데이트
function update() {
  player.vx = 0;

  if (keys["arrowleft"] || keys["a"]) {
    player.vx = -player.speed;
    player.facing = -1;
  }

  if (keys["arrowright"] || keys["d"]) {
    player.vx = player.speed;
    player.facing = 1;
  }

  // 맵 시작과 끝을 벗어나지 않게 함
  player.x += player.vx;
  player.x = Math.max(
    0,
    Math.min(worldWidth - player.w, player.x)
  );

  // 점프와 중력
  player.vy += gravity;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // 달리기 애니메이션
  if (player.vx !== 0) {
    player.tick++;

    if (player.tick % 8 === 0) {
      player.frame = (player.frame + 1) % 8;
    }
  } else {
    player.frame = 0;
  }

  // 카메라가 캐릭터를 따라감
  cameraX = player.x - 300;
  cameraX = Math.max(
    0,
    Math.min(worldWidth - canvas.width, cameraX)
  );
}

// 화면 그리기
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 긴 배경을 한 번만 그림
  if (bg.complete && bg.naturalWidth > 0) {
    const bgHeight = 540;
    const bgWidth =
      bg.naturalWidth * (bgHeight / bg.naturalHeight);

    ctx.drawImage(
      bg,
      -cameraX,
      0,
      bgWidth,
      bgHeight
    );
  } else {
    ctx.fillStyle = "#182238";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 바닥
  ctx.fillStyle = "#343b4d";
  ctx.fillRect(0, groundY, canvas.width, 90);

  // 캐릭터 그리기
  if (sprite.complete && sprite.naturalWidth > 0) {
    const cellW = sprite.naturalWidth / 4;
    const cellH = sprite.naturalHeight / 2;

    const col = player.frame % 4;
    const row = Math.floor(player.frame / 4);

    // 셀 아래쪽의 숫자 영역을 제외
    const sourceH = cellH * 0.88;
    const screenX = player.x - cameraX;

    ctx.save();

    if (player.facing === -1) {
      ctx.translate(screenX + player.w, 0);
      ctx.scale(-1, 1);

      ctx.drawImage(
        sprite,
        col * cellW, row * cellH,
        cellW, sourceH,
        0, player.y,
        player.w, player.h
      );
    } else {
      ctx.drawImage(
        sprite,
        col * cellW, row * cellH,
        cellW, sourceH,
        screenX, player.y,
        player.w, player.h
      );
    }

    ctx.restore();
  }

  // 화면 제목
  ctx.fillStyle = "white";
  ctx.font = "20px sans-serif";
  ctx.fillText("4층 - 야자 탈출!", 20, 35);

  // 맵 끝에 도착했을 때
  if (player.x >= worldWidth - player.w) {
    ctx.font = "32px sans-serif";
    ctx.fillText("탈출 성공!", 380, 250);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
