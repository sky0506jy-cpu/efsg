<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출 - 4층부터 1층까지!</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}
canvas { display: block; width: 100vw; height: 100vh; }
#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
}
#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="help">← → / A D : 이동<br>Space / ↑ : 점프<br>⚠️ 장애물을 피해서 오른쪽 끝으로 가세요!</div>
<button id="nextFloor">다음 층(아래층)으로 내려가기 ▶</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

// 파일명 반영
const school = new Image();
const character = new Image();
const tileSheet = new Image();

school.src = "./school.png";
character.src = "./character.png";
tileSheet.src = "./assets.png";

const keys = {};
let W = innerWidth, H = innerHeight;
let dpr = devicePixelRatio || 1;
let ready = false;
let finished = false;
let lastTime = 0;

// 4층에서 시작해서 1층으로 내려감
let currentFloor = 4; 

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

const MAP_SCALE = 2.5;
const PLAYER_W = 70;
const PLAYER_H = 90;

const player = {
  x: 50,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5.5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14.5,
  onGround: false
};

let platforms = [];
let hazards = [];

// 층별 난이도에 맞추어 맵 전체에 발판과 장애물 자동 생성
function fnMapGenerate() {
  platforms = [];
  hazards = [];

  let sectionCount = 3 + (4 - currentFloor); // 층이 낮을수록 구간 증가
  let sectionWidth = mapWidth / (sectionCount + 1);

  for (let i = 1; i <= sectionCount; i++) {
    let px = sectionWidth * i + (Math.random() * 100 - 50);
    let py = floorY - (100 + (i % 2) * 80);
    let pw = 180 - (4 - currentFloor) * 15; 
    platforms.push({ x: px, y: py, w: Math.max(100, pw), h: 25 });

    let hazardCount = 1 + (4 - currentFloor);
    for (let h = 0; h < hazardCount; h++) {
      let hx = px + 20 + h * 40;
      if (hx < mapWidth - 200) {
        hazards.push({ x: hx, y: floorY - 35, w: 45, h: 35 });
      }
    }
  }

  if (currentFloor <= 3) {
    hazards.push({ x: mapWidth * 0.45, y: floorY - 35, w: 50, h: 35 });
  }
  if (currentFloor <= 2) {
    hazards.push({ x: mapWidth * 0.7, y: floorY - 35, w: 50, h: 35 });
  }
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) return;

  mapWidth = Math.max(W * 2.5, school.naturalWidth * MAP_SCALE);
  mapHeight = school.naturalHeight * MAP_SCALE;

  mapY = H * -0.85;
  floorY = H * 0.82;
  
  fnMapGenerate();

  player.y = floorY - player.h;
  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  cameraX = Math.max(0, Math.min(player.x - W * 0.3, mapWidth - W));
  ready = true;
}

school.onload = setup;
character.onload = setup;
tileSheet.onload = setup;

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", " ", "a", "A", "d", "D"].includes(e.key)) {
    e.preventDefault();
  }

  if ((e.code === "Space" || e.key === "ArrowUp") && player.onGround && !finished) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.code] = true;
  keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
  keys[e.code] = false;
  keys[e.key.toLowerCase()] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

nextButton.addEventListener("click", () => {
  if (currentFloor > 1) {
    currentFloor--; // 4층 -> 3층 -> 2층 -> 1층
    resetPlayer();
    fnMapGenerate();
    nextButton.style.display = "none";
    finished = false;
    if (currentFloor === 1) {
      nextButton.textContent = "야자 탈출 완료! 🎉";
    }
  } else {
    currentFloor = 4;
    nextButton.textContent = "다음 층(아래층)으로 내려가기 ▶";
    resetPlayer();
    fnMapGenerate();
    nextButton.style.display = "none";
    finished = false;
  }
});

function resetPlayer() {
  player.x = 50;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  cameraX = 0;
}

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys["ArrowRight"] || keys["d"]) {
    player.x += player.speed * factor;
    player.facing = 1;
  }
  if (keys["ArrowLeft"] || keys["a"]) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  player.moving = Math.abs(player.x - oldX) > 0;

  // 중력
  player.velocityY += 0.65 * factor;
  player.y += player.velocityY * factor;

  // 바닥 충돌
  player.onGround = false;
  if (player.y + player.h >= floorY) {
    player.y = floorY - player.h;
    player.velocityY = 0;
    player.onGround = true;
  }

  // 발판 충돌
  for (let plat of platforms) {
    if (
      player.x + player.w > plat.x &&
      player.x < plat.x + plat.w &&
      player.y + player.h >= plat.y &&
      player.y + player.h - player.velocityY * factor <= plat.y + 12 &&
      player.velocityY >= 0
    ) {
      player.y = plat.y - player.h;
      player.velocityY = 0;
      player.onGround = true;
    }
  }

  // 장애물 충돌 (닿으면 처음 위치로 리셋)
  for (let haz of hazards) {
    if (
      player.x + player.w > haz.x + 8 &&
      player.x < haz.x + haz.w - 8 &&
      player.y + player.h > haz.y + 10 &&
      player.y < haz.y + haz.h
    ) {
      resetPlayer();
      break;
    }
  }

  // 애니메이션 (4열 x 2행 구조 대응)
  if (player.moving && player.onGround) {
    player.animTime += dt;
    if (player.animTime >= 90) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = player.x - W * 0.3;
  cameraX = Math.max(0, Math.min(cameraX, mapWidth - W));

  // 맵 오른쪽 끝에 도달하면 클리어
  if (player.x >= mapWidth - player.w - 30) {
    finished = true;
    nextButton.style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("로딩 중...", 20, 60);
    return;
  }

  // 1. 배경 복도 (school.png)
  ctx.drawImage(
    school,
    -cameraX,
    mapY,
    school.naturalWidth * MAP_SCALE,
    mapHeight
  );

  // 2. 발판 그리기
  ctx.fillStyle = "#2c4c82";
  for (let plat of platforms) {
    ctx.fillRect(plat.x - cameraX, plat.y, plat.w, plat.h);
    ctx.strokeStyle = "#5a8fd6";
    ctx.lineWidth = 3;
    ctx.strokeRect(plat.x - cameraX, plat.y, plat.w, plat.h);
  }

  // 3. 장애물 그리기
  ctx.fillStyle = "#c93b3b";
  for (let haz of hazards) {
    ctx.fillRect(haz.x - cameraX, haz.y, haz.w, haz.h);
    ctx.fillStyle = "#ff6b6b";
    ctx.fillRect(haz.x - cameraX + 5, haz.y, haz.w - 10, 8);
    ctx.fillStyle = "#c93b3b";
  }

  // 4. 바닥
  ctx.fillStyle = "#222738";
  ctx.fillRect(0, floorY, W, H - floorY);

  // 5. 캐릭터 (character.png)
  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = (player.frame % 4) * frameW;
  const sy = 0;

  ctx.save();
  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(character, sx, sy, frameW, frameH, 0, player.y, player.w, player.h);
  } else {
    ctx.drawImage(character, sx, sy, frameW, frameH, player.x - cameraX, player.y, player.w, player.h);
  }
  ctx.restore();

  // 상단 UI
  ctx.fillStyle = "white";
  ctx.font = "bold 22px sans-serif";
  ctx.fillText(`🏫 야자 탈출 - ${currentFloor}층 복도`, 20, 60);

  if (finished) {
    ctx.fillStyle = "#000b";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "white";
    ctx.font = "bold 32px sans-serif";
    ctx.textAlign = "center";
    let msg = currentFloor > 1 ? `${currentFloor}층 탈출 성공! 아래층으로 가자!` : `🎉 1층 탈출 성공! 야자 탈출 대성공!`;
    ctx.fillText(msg, W / 2, H / 2);
    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime ? time - lastTime : 16.67;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
