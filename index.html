```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
  pointer-events: none;
}
#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="help">
  ← → / A D : 이동<br>
  Space / ↑ : 점프<br>
  장애물에 닿거나 바닥으로 떨어지면 목숨 차감<br>
  목숨 3개 소진 시 처음부터 재시작
</div>

<button id="nextFloor">다음 층(아래층)으로 내려가기 ▶</button>
<canvas id="game"></canvas>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
const assets = new Image();

school.src = "./school.png";
character.src = "./character.png";
assets.src = "./assets.png";

const keys = Object.create(null);

let W = innerWidth;
let H = innerHeight;
let dpr = devicePixelRatio || 1;

let ready = false;
let finished = false;
let lastTime = 0;
let imageError = "";
let resetting = false;

let currentFloor = 4;
const MAX_LIVES = 3;
let lives = MAX_LIVES;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

const MAP_SCALE = 3.5;
const PLAYER_W = 82;
const PLAYER_H = 108;

// 점프가 도달할 수 있는 범위를 고려한 설정
const MAX_JUMP_GAP = 145;
const MIN_PLATFORM_GAP = 65;
const PLATFORM_HEIGHT = 30;

const player = {
  x: 35,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14,
  onGround: false
};

let platforms = [];
let hazards = [];

function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

function randomInt(min, max) {
  return Math.floor(randomRange(min, max + 1));
}

function fnMapGenerate() {
  platforms = [];
  hazards = [];

  if (!mapWidth || !floorY) return;

  const startX = 0;
  const endX = mapWidth - 180;

  // 시작 발판
  platforms.push({
    x: startX,
    y: floorY,
    w: 235,
    h: PLATFORM_HEIGHT,
    type: "start"
  });

  // 끝 발판: 출구에 반드시 연결
  platforms.push({
    x: Math.max(235, endX - 100),
    y: floorY - 35,
    w: Math.max(180, mapWidth - Math.max(235, endX - 100)),
    h: PLATFORM_HEIGHT,
    type: "finish"
  });

  const finishPlatform = platforms[1];
  const finishX = finishPlatform.x;

  // 출발 발판부터 끝 발판까지 일정 간격으로 연결
  let lastX = 235;
  let lastY = floorY - 45;

  const difficulty = 4 - currentFloor;

  while (lastX + 120 < finishX) {
    const remaining = finishX - lastX;

    // 간격을 안전한 범위로 제한
    const gap = Math.min(
      randomInt(75, 115 + difficulty * 5),
      remaining - 100
    );

    if (gap < MIN_PLATFORM_GAP) break;

    const px = lastX + gap;
    const pw = randomInt(115, 165);

    // 높이 차이는 작게 제한
    const verticalChange = randomInt(-22, 22);
    let py = lastY + verticalChange;

    py = Math.max(
      floorY - 105,
      Math.min(floorY - 25, py)
    );

    // 다음 발판까지 점프 가능한 수평 거리를 고려
    platforms.push({
      x: px,
      y: py,
      w: Math.min(pw, finishX - px),
      h: PLATFORM_HEIGHT,
      type: Math.random() < 0.3 ? "small" : "normal"
    });

    lastX = px + Math.min(pw, finishX - px);
    lastY = py;

    if (platforms.length > 500) break;
  }

  // 끝 발판과 연결되는 중간 발판이 부족하면 보충
  let previous = platforms[0];

  const ordered = platforms
    .filter(p => p.type !== "finish")
    .sort((a, b) => a.x - b.x);

  for (const next of ordered.slice(1)) {
    const gap = next.x - (previous.x + previous.w);

    if (gap > MAX_JUMP_GAP) {
      const count = Math.ceil(gap / 110);

      for (let i = 1; i < count; i++) {
        const px = previous.x + previous.w +
          (gap / count) * i - 45;

        const py = Math.max(
          floorY - 100,
          Math.min(floorY - 25, previous.y)
        );

        platforms.push({
          x: px,
          y: py,
          w: 100,
          h: PLATFORM_HEIGHT,
          type: "normal"
        });
      }
    }

    previous = next;
  }

  // 끝 발판 직전에도 발판이 이어지도록 보충
  platforms.sort((a, b) => a.x - b.x);

  let lastPlatform = platforms[platforms.length - 2];

  if (lastPlatform) {
    while (
      finishPlatform.x -
      (lastPlatform.x + lastPlatform.w) >
      MAX_JUMP_GAP
    ) {
      const px = lastPlatform.x + lastPlatform.w + 80;

      platforms.push({
        x: px,
        y: floorY - 45,
        w: 100,
        h: PLATFORM_HEIGHT,
        type: "normal"
      });

      lastPlatform = platforms[platforms.length - 1];
    }
  }

  // 바닥 장애물: 시작과 끝에는 안전 구역 확보
  const hazardStart = 270;
  const hazardEnd = finishPlatform.x - 100;
  let hx = hazardStart + randomInt(40, 100);

  while (hx < hazardEnd) {
    const hw = randomInt(38, 55);
    const hh = randomInt(30, 40);

    const nearPlatform = platforms.some(p =>
      hx + hw > p.x - 25 &&
      hx < p.x + p.w + 25
    );

    if (!nearPlatform) {
      hazards.push({
        x: hx,
        y: floorY - hh,
        w: hw,
        h: hh,
        type: "spikes"
      });
    }

    hx += randomInt(280, 380);
  }

  // 일부 발판 위 장애물
  for (const p of platforms) {
    if (
      p.type === "start" ||
      p.type === "finish" ||
      p.w < 155 ||
      Math.random() > 0.1
    ) {
      continue;
    }

    const hw = 28;
    const hx = p.x + randomInt(25, Math.max(26, p.w - hw - 20));

    hazards.push({
      x: hx,
      y: p.y - 28,
      w: hw,
      h: 28,
      type: "platformSpike"
    });
  }

  platforms.sort((a, b) => a.x - b.x);
  hazards.sort((a, b) => a.x - b.x);
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) {
    ready = false;
    return;
  }

  mapWidth = Math.max(
    W + 1,
    school.naturalWidth * MAP_SCALE
  );

  mapHeight = school.naturalHeight * MAP_SCALE;
  mapY = (H - mapHeight) / 2 + PLAYER_H * 2;

  const backgroundFloorY = mapY + 392 * MAP_SCALE;
  floorY = Math.min(backgroundFloorY, H - PLAYER_H - 10);

  fnMapGenerate();

  player.x = 35;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;

  cameraX = 0;
  ready = true;
  imageError = "";
}

school.onload = setup;
character.onload = setup;

school.onerror = () => {
  imageError = "school.png 파일을 불러오지 못했습니다. 파일 이름과 위치를 확인하세요.";
  ready = false;
};

character.onerror = () => {
  imageError = "character.png 파일을 불러오지 못했습니다. 파일 이름과 위치를 확인하세요.";
  ready = false;
};

assets.onerror = () => {
  console.error("assets.png를 불러오지 못했습니다. 기본 도형으로 표시합니다.");
};

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (
    ["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key) ||
    ["KeyA", "KeyD", "Space"].includes(e.code)
  ) {
    e.preventDefault();
  }

  const jumpPressed =
    e.code === "Space" || e.key === "ArrowUp";

  if (
    jumpPressed &&
    !keys[e.code] &&
    !keys[e.key] &&
    player.onGround &&
    !finished &&
    ready
  ) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.key] = true;
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

function resetPlayer() {
  player.x = 35;
  player.y = floorY - player.h;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  player.animTime = 0;
  player.moving = false;
  cameraX = 0;
}

function restartGame() {
  currentFloor = 4;
  lives = MAX_LIVES;
  finished = false;
  resetting = false;

  nextButton.style.display = "none";
  nextButton.textContent = "다음 층(아래층)으로 내려가기 ▶";

  fnMapGenerate();
  resetPlayer();
}

function loseLife() {
  if (finished || resetting) return;

  resetting = true;
  lives--;

  if (lives <= 0) {
    restartGame();
    return;
  }

  fnMapGenerate();
  resetPlayer();
  resetting = false;
}

nextButton.addEventListener("click", () => {
  if (currentFloor > 1) {
    currentFloor--;
    lives = MAX_LIVES;
    finished = false;

    nextButton.style.display = "none";
    fnMapGenerate();
    resetPlayer();
  } else {
    restartGame();
  }
});

function intersects(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys.ArrowRight || keys.d || keys.D || keys.KeyD) {
    player.x += player.speed * factor;
    player.facing = 1;
  }

  if (keys.ArrowLeft || keys.a || keys.A || keys.KeyA) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(
    0,
    Math.min(player.x, mapWidth - player.w)
  );

  player.moving = Math.abs(player.x - oldX) > 0;

  const previousBottom = player.y + player.h;

  player.onGround = false;
  player.velocityY += 0.65 * factor;
  player.y += player.velocityY * factor;

  // 발판 위로 내려올 때 착지
  if (player.velocityY >= 0) {
    for (const p of platforms) {
      const overlapX =
        player.x + player.w - 8 > p.x &&
        player.x + 8 < p.x + p.w;

      const crossedTop =
        previousBottom <= p.y + 10 &&
        player.y + player.h >= p.y;

      if (overlapX && crossedTop) {
        player.y = p.y - player.h;
        player.velocityY = 0;
        player.onGround = true;
        break;
      }
    }
  }

  // 발판을 놓치고 바닥까지 떨어지면 목숨 차감
  if (player.y + player.h >= floorY && !player.onGround) {
    loseLife();
    return;
  }

  // 화면 아래로 완전히 떨어지는 경우도 처리
  if (player.y > H + 100) {
    loseLife();
    return;
  }

  const hitbox = {
    x: player.x + 12,
    y: player.y + 12,
    w: player.w - 24,
    h: player.h - 18
  };

  for (const h of hazards) {
    const hazardBox = {
      x: h.x + 5,
      y: h.y + 5,
      w: Math.max(8, h.w - 10),
      h: Math.max(8, h.h - 5)
    };

    if (intersects(hitbox, hazardBox)) {
      loseLife();
      return;
    }
  }

  if (player.moving && player.onGround) {
    player.animTime += dt;

    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = Math.max(
    0,
    Math.min(player.x - W * 0.25, mapWidth - W)
  );

  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
    nextButton.textContent = currentFloor > 1
      ? "다음 층(아래층)으로 내려가기 ▶"
      : "탈출 완료! 처음부터 다시 ▶";
  }
}

function drawPlatform(p) {
  const x = p.x - cameraX;

  if (assets.complete && assets.naturalWidth > 0) {
    ctx.drawImage(
      assets,
      16, 108, 294, 72,
      x, p.y, p.w, p.h
    );
  } else {
    ctx.fillStyle = p.type === "start"
      ? "#526d8e"
      : p.type === "small"
        ? "#476a9f"
        : "#3b5b92";

    ctx.fillRect(x, p.y, p.w, p.h);

    ctx.fillStyle = "#8ebaff";
    ctx.fillRect(x, p.y, p.w, 5);

    ctx.strokeStyle = "#223a61";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, p.y, p.w, p.h);
  }
}

function drawHazard(h) {
  const x = h.x - cameraX;

  if (h.type === "platformSpike") {
    ctx.fillStyle = "#ff654f";
    ctx.beginPath();
    ctx.moveTo(x, h.y + h.h);
    ctx.lineTo(x + h.w * 0.5, h.y);
    ctx.lineTo(x + h.w, h.y + h.h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffb5a7";
    ctx.beginPath();
    ctx.moveTo(x + h.w * 0.35, h.y + h.h * 0.65);
    ctx.lineTo(x + h.w * 0.5, h.y + h.h * 0.2);
    ctx.lineTo(x + h.w * 0.65, h.y + h.h * 0.65);
    ctx.closePath();
    ctx.fill();
    return;
  }

  if (assets.complete && assets.naturalWidth > 0) {
    ctx.drawImage(
      assets,
      1260, 275, 110, 70,
      x, h.y, h.w, h.h
    );
  } else {
    ctx.fillStyle = "#e53945";
    ctx.beginPath();

    const spikeCount = Math.max(2, Math.floor(h.w / 18));
    const spikeWidth = h.w / spikeCount;

    ctx.moveTo(x, h.y + h.h);

    for (let i = 0; i < spikeCount; i++) {
      ctx.lineTo(
        x + i * spikeWidth + spikeWidth / 2,
        h.y
      );
      ctx.lineTo(
        x + (i + 1) * spikeWidth,
        h.y + h.h
      );
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ff8b8b";
    ctx.fillRect(x, h.y + h.h - 5, h.w, 5);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(
      imageError || "이미지를 불러오는 중...",
      20,
      60
    );
    return;
  }

  if (school.complete && school.naturalWidth > 0) {
    ctx.drawImage(
      school,
      -cameraX,
      mapY,
      school.naturalWidth * MAP_SCALE,
      mapHeight
    );
  }

  for (const p of platforms) {
    if (
      p.x - cameraX < W + 150 &&
      p.x - cameraX + p.w > -150
    ) {
      drawPlatform(p);
    }
  }

  for (const h of hazards) {
    if (
      h.x - cameraX < W + 150 &&
      h.x - cameraX + h.w > -150
    ) {
      drawHazard(h);
    }
  }

  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = (player.frame % 4) * frameW;
  const sy = player.frame >= 4 ? frameH : 0;

  ctx.save();

  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      0, player.y, player.w, player.h
    );
  } else {
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      player.x - cameraX, player.y, player.w, player.h
    );
  }

  ctx.restore();

  ctx.textAlign = "left";
  ctx.fillStyle = "white";
  ctx.font = "bold 22px sans-serif";
  ctx.fillText(`🏫 야자 탈출 - ${currentFloor}층 복도`, 20, 125);

  ctx.font = "bold 25px sans-serif";
  ctx.fillStyle = "#ff5b70";
  ctx.fillText("❤️".repeat(lives), 20, 160);

  ctx.fillStyle = "white";
  ctx.font = "16px sans-serif";
  ctx.fillText(`목숨 ${lives}/${MAX_LIVES}`, 20, 185);

  if (finished) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "white";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";

    ctx.fillText(
      currentFloor > 1
        ? `${currentFloor}층 복도 끝에 도착했다! 아래층으로!`
        : "🎉 1층 탈출 성공! 야자 탈출 완료!",
      W / 2,
      H / 2
    );

    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime
    ? Math.min(time - lastTime, 50)
    : 16.67;

  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
```
