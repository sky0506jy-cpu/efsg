<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>야자 탈출</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101525;
      font-family: sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #help {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 2;
      padding: 10px 14px;
      border-radius: 10px;
      background: #000b;
      color: white;
      font-size: 14px;
    }

    #nextFloor {
      display: none;
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 3;
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #ffd34e;
      color: #222;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="help">← → 방향키 또는 A / D 로 이동</div>
  <button id="nextFloor">다음 층으로 ▶</button>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const nextButton = document.getElementById("nextFloor");

    const school = new Image();
    const character = new Image();

    school.src = "./school.png";
    character.src = "./character.png";

    const keys = {};

    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;

    // 맵 확대 배율
    const ZOOM = 3;

    // 복도 이미지의 세로 위치 조절
    const HALLWAY_Y_RATIO = 0.48;

    let mapWidth = 0;
    let cameraX = 0;
    let hallwayY = 0;
    let hallwayHeight = 0;
    let hallwayWidth = 0;
    let floorY = 0;
    let ready = false;
    let finished = false;
    let lastTime = 0;

    const player = {
      x: 30,
      y: 0,
      w: 66,
      h: 82,
      speed: 5,
      frame: 0,
      animTime: 0,
      moving: false
    };

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      dpr = window.devicePixelRatio || 1;

      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      setup();
    }

    function setup() {
      if (!school.complete || !school.naturalWidth ||
          !character.complete || !character.naturalWidth) {
        return;
      }

      // 원본 비율을 유지해 맵을 확대
      hallwayWidth = school.naturalWidth * ZOOM;
      hallwayHeight = school.naturalHeight * ZOOM;

      mapWidth = Math.max(hallwayWidth, W);

      // 화면에서 복도가 보이도록 이미지 전체를 중앙에 배치
      hallwayY = H * HALLWAY_Y_RATIO - hallwayHeight / 2;

      // 캐릭터가 서 있는 바닥
      floorY = H * 0.84;
      player.y = floorY - player.h;

      player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
      cameraX = 0;
      ready = true;
    }

    school.onload = setup;
    character.onload = setup;

    school.onerror = () => {
      document.getElementById("help").textContent =
        "school.png를 불러오지 못했어요.";
    };

    character.onerror = () => {
      document.getElementById("help").textContent =
        "character.png를 불러오지 못했어요.";
    };

    window.addEventListener("resize", resize);
    resize();

    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", "a", "A", "d", "D"].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    window.addEventListener("blur", () => {
      for (const key in keys) keys[key] = false;
    });

    nextButton.addEventListener("click", () => {
      player.x = 0;
      cameraX = 0;
      finished = false;
      nextButton.style.display = "none";
    });

    function update(dt) {
      if (!ready || finished) return;

      const oldX = player.x;
      const step = player.speed * Math.min(dt / 16.67, 2);

      if (keys.ArrowRight || keys.d || keys.D) player.x += step;
      if (keys.ArrowLeft || keys.a || keys.A) player.x -= step;

      player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
      player.moving = player.x !== oldX;

      if (player.moving) {
        player.animTime += dt;
        if (player.animTime >= 120) {
          player.frame = (player.frame + 1) % 4;
          player.animTime = 0;
        }
      } else {
        player.frame = 0;
        player.animTime = 0;
      }

      // 캐릭터를 따라가는 카메라
      cameraX = player.x - W * 0.3;
      cameraX = Math.max(0, Math.min(cameraX, mapWidth - W));

      if (player.x >= mapWidth - player.w - 1) {
        finished = true;
        nextButton.style.display = "block";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 하늘색 대신 복도 이미지와 어울리는 어두운 배경
      ctx.fillStyle = "#101525";
      ctx.fillRect(0, 0, W, H);

      if (!ready) {
        ctx.fillStyle = "white";
        ctx.font = "18px sans-serif";
        ctx.fillText("이미지를 불러오는 중...", 20, 60);
        return;
      }

      // 배경 이미지는 한 번만 그려 반복하지 않음
      ctx.drawImage(
        school,
        -cameraX,
        hallwayY,
        hallwayWidth,
        hallwayHeight
      );

      // 캐릭터가 걷는 바닥
      ctx.fillStyle = "#343434";
      ctx.fillRect(0, floorY, W, H - floorY);

      // 스프라이트 시트 4열 x 2행
      const frameW = character.naturalWidth / 4;
      const frameH = character.naturalHeight / 2;

      ctx.imageSmoothingEnabled = false;

      ctx.drawImage(
        character,
        player.frame * frameW,
        0,
        frameW,
        frameH,
        player.x - cameraX,
        player.y,
        player.w,
        player.h
      );

      if (finished) {
        ctx.fillStyle = "#0009";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "white";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("복도 끝에 도착했다!", W / 2, H / 2);
        ctx.textAlign = "left";
      }
    }

    function loop(time) {
      const dt = lastTime ? time - lastTime : 16.67;
      lastTime = time;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
