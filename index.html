
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101525;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#help{position:fixed;top:12px;left:12px;z-index:2;padding:10px 13px;border-radius:10px;color:#fff;background:#000b;line-height:1.5;font-size:14px;pointer-events:none}
#nextFloor{display:none;position:fixed;top:12px;right:12px;z-index:3;padding:12px 16px;border:0;border-radius:10px;background:#ffd34e;font-weight:bold;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="help">
← → / A D : 이동<br>
Space / ↑ / W : 점프<br>
장애물에 닿으면 목숨 감소 · 목숨 3개 소진 시 현재 층 재시작<br>
발판을 이어서 이동하세요!
</div>
<button id="nextFloor">다음 층으로 ▶</button>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const nextButton=document.getElementById('nextFloor');

const school=new Image();
const character=new Image();
const assets=new Image();

school.src='./school.png';
character.src='./character.png';
assets.src='./assets.png';

let W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
let ready=false,finished=false,currentFloor=4,lives=3,coins=0;
let cameraX=0,lastTime=0,mapWidth=0,bgScale=1,bgY=0,floorY=0;
let platforms=[],hazards=[],pickups=[],moving=[];

const MAX_LIVES=3;
const player={
 x:45,y:0,w:58,h:78,speed:5.2,vy:0,
 jumpPower:15.8,onGround:false,facing:1,
 frame:0,anim:0,invuln:0
};

const SPR={
 long:{x:16,y:108,w:294,h:72},
 medium:{x:330,y:108,w:128,h:72},
 square:{x:470,y:108,w:72,h:72},
 hazard:{x:1260,y:275,w:110,h:70},
 spike:{x:1260,y:275,w:110,h:70},
 desk:{x:155,y:400,w:115,h:72},
 laser:{x:960,y:395,w:115,h:58},
 coin:{x:12,y:622,w:160,h:48},
 heart:{x:205,y:620,w:65,h:55}
};

function resize(){
 W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(school.complete&&school.naturalWidth)setup(false);
}

function setup(reset=true){
 if(!school.naturalWidth||!character.naturalWidth){
  ready=false;
  return;
 }
 bgScale=Math.max(.78,Math.min(1.35,H/school.naturalHeight));
 bgY=H*.10;
 mapWidth=Math.max(W*3.8,school.naturalWidth*bgScale);
 floorY=Math.min(H*.84,Math.max(H*.70,bgY+school.naturalHeight*bgScale*.78));
 if(reset){
  makeLevel();
  resetPlayer();
 }
 ready=true;
}

function makeLevel(){
 platforms=[];
 hazards=[];
 pickups=[];
 moving=[];

 // 층이 내려갈수록 오브젝트 수 증가
 const total=38+(4-currentFloor)*12;
 const gap=Math.max(100,(mapWidth-360)/(total+1));

 for(let i=1;i<=total;i++){
  const x=160+i*gap;
  const type=i%7===0?'long':i%4===0?'medium':i%3===0?'square':'medium';
  const w=type==='long'?145:type==='medium'?94:66;
  const y=floorY-(i%5===0?205:i%3===0?145:100+(i%2)*28);

  platforms.push({x,y,w,h:26,type});

  if(i%2===0||(currentFloor<=2&&i%3!==0)){
   const hx=x-gap*.72;
   const hw=42+(i%3)*5;
   hazards.push({x:hx,y:floorY-29,w:hw,h:29,type:'spike'});
  }

  if(currentFloor<=3&&i%5===0){
   hazards.push({x:x+w+18,y:y-32,w:45,h:34,type:'spike'});
  }

  if(i%4===1){
   pickups.push({
    x:x+w/2-10,y:y-36,w:20,h:22,
    type:'coin',taken:false
   });
  }
 }

 for(let i=0;i<Math.floor(total/5);i++){
  const x=300+i*gap*5;
  if(i%3===0){
   hazards.push({x,y:floorY-92,w:50,h:62,type:'desk'});
  }else if(i%3===1){
   moving.push({
    x,y:floorY-165,w:100,h:25,
    baseY:floorY-165,phase:i*1.8,type:'moving'
   });
  }else{
   hazards.push({x,y:floorY-125,w:34,h:78,type:'laser'});
  }
 }

 for(let i=1;i<=3;i++){
  pickups.push({
   x:mapWidth*i/4,y:floorY-220,w:30,h:32,
   type:'heart',taken:false
  });
 }

 platforms.unshift({
  x:W*.48,y:floorY-80,w:100,h:25,type:'long'
 });
 platforms.push({
  x:mapWidth-180,y:floorY-85,w:130,h:25,type:'long'
 });
}

function resetPlayer(){
 player.x=35;
 player.y=floorY-player.h;
 player.vy=0;
 player.onGround=true;
 player.facing=1;
 player.frame=0;
 player.anim=0;
 player.invuln=900;
 cameraX=0;
}

school.onload=()=>setup(true);
character.onload=()=>setup(true);
school.onerror=()=>console.error('school.png를 불러오지 못했습니다.');
character.onerror=()=>console.error('character.png를 불러오지 못했습니다.');
assets.onerror=()=>console.error('assets.png를 불러오지 못했습니다.');

addEventListener('resize',resize);
resize();

const keys={};

addEventListener('keydown',e=>{
 const jump=['Space','ArrowUp','KeyW'].includes(e.code);

 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)||
 ['KeyA','KeyD','KeyW','Space'].includes(e.code)){
  e.preventDefault();
 }

 if(jump&&!keys[e.code]&&player.onGround&&!finished){
  player.vy=-player.jumpPower;
  player.onGround=false;
 }

 keys[e.code]=true;
 keys[e.key]=true;
});

addEventListener('keyup',e=>{
 keys[e.code]=false;
 keys[e.key]=false;
});

addEventListener('blur',()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

function hit(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&
 a.y<b.y+b.h&&a.y+a.h>b.y;
}

function loseLife(){
 if(player.invuln>0)return;
 lives--;
 if(lives<=0){
  lives=MAX_LIVES;
  makeLevel();
 }
 resetPlayer();
}

function update(dt){
 if(!ready||finished)return;

 const f=Math.min(dt/16.67,2);

 if(player.invuln>0)player.invuln-=dt;

 const oldX=player.x;

 if(keys.ArrowRight||keys.KeyD||keys.d||keys.D){
  player.x+=player.speed*f;
  player.facing=1;
 }

 if(keys.ArrowLeft||keys.KeyA||keys.a||keys.A){
  player.x-=player.speed*f;
  player.facing=-1;
 }

 player.x=Math.max(0,Math.min(mapWidth-player.w,player.x));

 const prevBottom=player.y+player.h;
 player.vy+=.58*f;
 player.y+=player.vy*f;
 player.onGround=false;

 if(player.y+player.h>=floorY){
  player.y=floorY-player.h;
  player.vy=0;
  player.onGround=true;
 }

 for(const p of platforms){
  if(player.vy>=0&&player.x+player.w-8>p.x&&
     player.x+8<p.x+p.w&&prevBottom<=p.y+12&&
     player.y+player.h>=p.y){
   player.y=p.y-player.h;
   player.vy=0;
   player.onGround=true;
  }
 }

 for(const m of moving){
  m.y=m.baseY+Math.sin(performance.now()/420+m.phase)*26;
 }

 if(player.invuln<=0){
  const hb={
   x:player.x+10,y:player.y+9,
   w:player.w-20,h:player.h-14
  };

  for(const h of hazards){
   const box={
    x:h.x+4,y:h.y+5,w:h.w-8,h:h.h-5
   };
   if(hit(hb,box)){
    loseLife();
    break;
   }
  }

  for(const m of moving){
   if(hit(hb,{x:m.x,y:m.y,w:m.w,h:m.h})){
    loseLife();
    break;
   }
  }
 }

 for(const c of pickups){
  if(!c.taken&&hit({
   x:player.x+8,y:player.y+8,
   w:player.w-16,h:player.h-12
  },c)){
   c.taken=true;
   if(c.type==='coin')coins++;
   else lives=Math.min(MAX_LIVES,lives+1);
  }
 }

 if(Math.abs(player.x-oldX)>.1&&player.onGround){
  player.anim+=dt;
  if(player.anim>105){
   player.frame=(player.frame+1)%4;
   player.anim=0;
  }
 }else if(!player.onGround){
  player.frame=2;
 }else{
  player.frame=0;
 }

 cameraX=Math.max(0,Math.min(player.x-W*.32,mapWidth-W));

 if(player.x>=mapWidth-player.w-2){
  finished=true;
  nextButton.style.display='block';
  nextButton.textContent=currentFloor>1?
   '다음 층으로 내려가기 ▶':'🎉 탈출 완료! 다시 하기';
 }
}

function sprite(name,x,y,w,h){
 const s=SPR[name];
 if(assets.complete&&assets.naturalWidth>=1536&&s){
  ctx.drawImage(
   assets,s.x,s.y,s.w,s.h,
   x-cameraX,y,w,h
  );
  return true;
 }
 return false;
}

function drawPlatform(p){
 if(sprite(p.type,p.x,p.y,p.w,p.h))return;
 ctx.fillStyle='#3478c7';
 ctx.fillRect(p.x-cameraX,p.y,p.w,p.h);
 ctx.fillStyle='#9acaff';
 ctx.fillRect(p.x-cameraX,p.y,p.w,4);
}

function drawHazard(h){
 if(h.type==='spike'&&sprite('spike',h.x,h.y,h.w,h.h))return;
 if(h.type==='desk'&&sprite('desk',h.x,h.y,h.w,h.h))return;
 if(h.type==='laser'&&sprite('laser',h.x,h.y,h.w,h.h))return;

 ctx.fillStyle=h.type==='laser'?'#ff4b9b':'#ff4155';
 ctx.fillRect(h.x-cameraX,h.y,h.w,h.h);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#101525';
 ctx.fillRect(0,0,W,H);

 if(!ready){
  ctx.fillStyle='white';
  ctx.font='18px sans-serif';
  ctx.fillText('이미지를 불러오는 중...',20,60);
  return;
 }

 const bgW=school.naturalWidth*bgScale;

 for(let x=0;x<mapWidth;x+=bgW){
  ctx.drawImage(
   school,x-cameraX,bgY,bgW,
   Math.max(1,H-bgY-(H-floorY)*.65)
  );
 }

 // 바닥은 화면 아래로 밀려나지 않도록 화면 높이 기준으로 고정
 ctx.fillStyle='#101525';
 ctx.fillRect(0,floorY,W,H-floorY);
 ctx.fillStyle='#26324b';
 ctx.fillRect(0,floorY-8,W,10);

 for(const p of platforms){
  if(p.x-cameraX<W+200&&p.x-cameraX+p.w>-200)drawPlatform(p);
 }

 for(const h of hazards){
  if(h.x-cameraX<W+150&&h.x-cameraX+h.w>-150)drawHazard(h);
 }

 for(const m of moving){
  if(!sprite('medium',m.x,m.y,m.w,m.h)){
   ctx.fillStyle='#f8c542';
   ctx.fillRect(m.x-cameraX,m.y,m.w,m.h);
  }
 }

 for(const c of pickups){
  if(c.taken)continue;

  if(c.type==='coin'){
   if(!sprite('coin',c.x,c.y,c.w,c.h)){
    ctx.fillStyle='#ffd438';
    ctx.beginPath();
    ctx.arc(c.x-cameraX+10,c.y+10,9,0,Math.PI*2);
    ctx.fill();
   }
  }else if(!sprite('heart',c.x,c.y,c.w,c.h)){
   ctx.fillStyle='#ff536a';
   ctx.font='25px sans-serif';
   ctx.fillText('♥',c.x-cameraX,c.y+22);
  }
 }

 const fw=character.naturalWidth/4;
 const fh=character.naturalHeight/2;
 const sx=(player.frame%4)*fw;
 const sy=0;
 const px=player.x-cameraX;

 ctx.save();

 if(player.invuln>0&&Math.floor(player.invuln/90)%2===0){
  ctx.globalAlpha=.45;
 }

 if(player.facing<0){
  ctx.translate(px+player.w,0);
  ctx.scale(-1,1);
  ctx.drawImage(
   character,sx,sy,fw,fh,
   0,player.y,player.w,player.h
  );
 }else{
  ctx.drawImage(
   character,sx,sy,fw,fh,
   px,player.y,player.w,player.h
  );
 }

 ctx.restore();

 ctx.fillStyle='#000b';
 ctx.fillRect(12,112,225,96);

 ctx.fillStyle='#fff';
 ctx.font='bold 20px sans-serif';
 ctx.fillText(`야자 탈출 - ${currentFloor}층`,22,139);

 ctx.font='22px sans-serif';
 ctx.fillStyle='#ff5c72';
 ctx.fillText('❤️'.repeat(lives),22,169);

 ctx.fillStyle='#fff';
 ctx.font='15px sans-serif';
 ctx.fillText(
  `코인 ${coins}개 · 목숨 ${lives}/${MAX_LIVES}`,
  22,193
 );

 if(finished){
  ctx.fillStyle='#000b';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='white';
  ctx.textAlign='center';
  ctx.font='bold 30px sans-serif';

  ctx.fillText(
   currentFloor>1?
   `${currentFloor}층 통과! 아래층으로 내려가자!`:
   '🎉 1층 탈출 성공! 야자 탈출 완료!',
   W/2,H/2
  );

  ctx.textAlign='left';
 }
}

nextButton.addEventListener('click',()=>{
 if(currentFloor>1){
  currentFloor--;
 }else{
  currentFloor=4;
  coins=0;
 }

 lives=MAX_LIVES;
 finished=false;
 nextButton.style.display='none';
 makeLevel();
 resetPlayer();
});

function loop(t){
 const dt=lastTime?Math.min(t-lastTime,40):16.67;
 lastTime=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
