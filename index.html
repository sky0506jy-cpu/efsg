<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}
canvas { display: block; width: 100vw; height: 100vh; }
#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
}
#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="help">← → / A D : 이동<br>Space / ↑ : 점프</div>
<button id="nextFloor">다음 층으로 ▶</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
school.src = "./school.png";
character.src = "./character.png";

const keys = {};
let W = innerWidth, H = innerHeight;
let dpr = devicePixelRatio || 1;
let ready = false;
let finished = false;
let lastTime = 0;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

// 크기 조절
const MAP_SCALE = 3.0;
const PLAYER_W = 100;
const PLAYER_H = 120;

const player = {
  x: 40,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14,
  onGround: true
};

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) return;

  mapWidth = Math.max(W, school.naturalWidth * MAP_SCALE);
  mapHeight = school.naturalHeight * MAP_SCALE;

  // 복도 이미지 전체의 여백을 고려해 세로 위치 조정
  mapY = H * -0.88;

  floorY = H * 0.84;
  player.y = floorY - player.h;
  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  cameraX = Math.max(0, Math.min(player.x - W * 0.3, mapWidth - W));
  ready = true;
}

school.onload = setup;
character.onload = setup;

school.onerror = () => {
  document.getElementById("help").textContent =
    "school.png 파일을 불러올 수 없어요.";
};
character.onerror = () => {
  document.getElementById("help").textContent =
    "character.png 파일을 불러올 수 없어요.";
};

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp"," ","a","A","d","D"].includes(e.key)) {
    e.preventDefault();
  }

  if (
    (e.code === "Space" || e.key === "ArrowUp") &&
    !keys[e.code] &&
    player.onGround &&
    !finished
  ) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.key] = true;
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

nextButton.addEventListener("click", () => {
  player.x = 0;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  cameraX = 0;
  finished = false;
  nextButton.style.display = "none";
  player.y = floorY - player.h;
});

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;

  if (keys.ArrowRight || keys.d || keys.D) {
    player.x += player.speed * factor;
    player.facing = 1;
  }
  if (keys.ArrowLeft || keys.a || keys.A) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  player.moving = Math.abs(player.x - oldX) > 0;

  // 중력과 점프
  if (!player.onGround) {
    player.velocityY += 0.65 * factor;
    player.y += player.velocityY * factor;

    if (player.y + player.h >= floorY) {
      player.y = floorY - player.h;
      player.velocityY = 0;
      player.onGround = true;
    }
  }

  if (player.moving && player.onGround) {
    player.animTime += dt;
    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = player.x - W * 0.3;
  cameraX = Math.max(0, Math.min(cameraX, mapWidth - W));

  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("이미지를 불러오는 중...", 20, 60);
    return;
  }

  // 맵은 반복하지 않고 한 번만 표시
  ctx.drawImage(
    school,
    -cameraX,
    mapY,
    school.naturalWidth * MAP_SCALE,
    mapHeight
  );

  // 바닥
  ctx.fillStyle = "#343434";
  ctx.fillRect(0, floorY, W, H - floorY);

  // 스프라이트 4열 x 2행. 숫자가 있는 아래쪽은 사용하지 않음.
  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = player.frame * frameW;
  const sy = 0;

  ctx.save();

  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      0, player.y, player.w, player.h
    );
  } else {
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      player.x - cameraX, player.y, player.w, player.h
    );
  }

  ctx.restore();

  if (finished) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "white";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("복도 끝에 도착했다!", W / 2, H / 2);
    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime ? time - lastTime : 16.67;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
