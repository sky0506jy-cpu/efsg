<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야자 탈출</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171923;
      color: white;
      font-family: Arial, "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    #game-wrap {
      width: min(960px, 100%);
      text-align: center;
    }

    h1 {
      margin: 4px 0 10px;
      font-size: clamp(23px, 4vw, 32px);
    }

    #status {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 15px;
    }

    #game-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 3px solid #f1f1f1;
      border-radius: 10px;
      background: #9bd9ff;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    #message {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.78);
      font-size: 22px;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;

      color: #222;
    }

    button:hover {
      filter: brightness(1.08);
    }

    #controls {
      margin-top: 10px;
      color: #d7d9e0;
      font-size: 13px;
      line-height: 1.7;
    }

    #mobile-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    #mobile-controls button {
      min-width: 74px;
      touch-action: none;
      user-select: none;
    }

    #jump-btn {
      background: #75e0a0;
    }

    @media (min-width: 760px) {
      #mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="game-wrap">
    <h1>🏫 야자 탈출</h1>

    <div id="status">
      <span id="floor-label">현재 층: 4층</span>
      <span id="life-label">❤️ ❤️ ❤️</span>
      <span id="difficulty-label">난이도: 연습</span>
    </div>

    <div id="game-box">
      <canvas id="game" width="960" height="540"></canvas>

      <div id="message">
        <div id="message-title">게임 종료!</div>
        <div id="message-desc"></div>
        <button id="restart-btn">다시 도전하기</button>
      </div>
    </div>

    <div id="mobile-controls">
      <button id="left-btn">◀ 왼쪽</button>
      <button id="jump-btn">점프 ⬆</button>
      <button id="right-btn">오른쪽 ▶</button>
    </div>

    <div id="controls">
      이동: ← → 또는 A / D · 점프: Space 또는 ↑<br>
      발판을 밟고 아래로 내려가 탈출구에 도착하세요. 가시와 장애물을 조심하세요!
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    const backgroundImage = new Image();
    backgroundImage.src = "school.png";

    const characterImage = new Image();
    characterImage.src = "character.png";

    const assetsImage = new Image();
    assetsImage.src = "assets.png";

    const FLOOR_SETTINGS = {
      4: {
        name: "연습",
        gapMin: 95,
        gapMax: 125,
        platformMin: 155,
        platformMax: 230,
        spikeChance: 0.12,
        movingCount: 0,
        speed: 4.5,
        jumpPower: 15.5,
        gravity: 0.68
      },
      3: {
        name: "보통",
        gapMin: 115,
        gapMax: 150,
        platformMin: 125,
        platformMax: 195,
        spikeChance: 0.30,
        movingCount: 1,
        speed: 4.8,
        jumpPower: 15.5,
        gravity: 0.70
      },
      2: {
        name: "어려움",
        gapMin: 130,
        gapMax: 165,
        platformMin: 105,
        platformMax: 165,
        spikeChance: 0.45,
        movingCount: 2,
        speed: 5.1,
        jumpPower: 15.7,
        gravity: 0.72
      },
      1: {
        name: "매우 어려움",
        gapMin: 140,
        gapMax: 175,
        platformMin: 95,
        platformMax: 145,
        spikeChance: 0.58,
        movingCount: 3,
        speed: 5.3,
        jumpPower: 15.8,
        gravity: 0.73
      }
    };

    const PLAYER_W = 48;
    const PLAYER_H = 66;
    const GROUND_Y = 500;
    const MAP_SCALE = 3.5;

    let currentFloor = 4;
    let lives = 3;
    let platforms = [];
    let hazards = [];
    let movingHazards = [];
    let exitDoor = null;
    let cameraY = 0;
    let gameState = "playing";
    let invincibleTimer = 0;
    let jumpPressed = false;
    let lastTime = 0;
    let animationTime = 0;

    const keys = {
      left: false,
      right: false
    };

    const player = {
      x: 70,
      y: 420,
      w: PLAYER_W,
      h: PLAYER_H,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1,
      frame: 0,
      frameTimer: 0
    };

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randInt(min, max) {
      return Math.floor(rand(min, max + 1));
    }

    function updateStatus() {
      document.getElementById("floor-label").textContent =
        "현재 층: " + currentFloor + "층";

      document.getElementById("life-label").textContent =
        "❤️ ".repeat(lives).trim() || "하트 없음";

      document.getElementById("difficulty-label").textContent =
        "난이도: " + FLOOR_SETTINGS[currentFloor].name;
    }

    function showMessage(title, desc) {
      document.getElementById("message-title").textContent = title;
      document.getElementById("message-desc").textContent = desc;
      document.getElementById("message").style.display = "flex";
    }

    function hideMessage() {
      document.getElementById("message").style.display = "none";
    }

    function resetPlayer(x, y) {
      player.x = x;
      player.y = y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.facing = 1;
      invincibleTimer = 90;
    }

    // 발판 사이 간격과 높이 차이를 점프 능력 안에서 생성한다.
    function generatePlatforms() {
      platforms = [];
      hazards = [];
      movingHazards = [];

      const cfg = FLOOR_SETTINGS[currentFloor];

      const startY = 75;
      const finishX = W - 100;

      platforms.push({
        x: 0,
        y: GROUND_Y,
        w: 225,
        h: 40,
        safe: true
      });

      let x = 185;
      let y = GROUND_Y - 5;
      let attempts = 0;

      while (x < finishX && attempts < 40) {
        attempts++;

        const remaining = finishX - x;

        // 마지막 발판은 출구에 도달할 수 있도록 보장한다.
        if (remaining < cfg.platformMax + cfg.gapMax + 25) {
          const lastX = Math.min(
            finishX,
            x + rand(cfg.gapMin, Math.min(cfg.gapMax, 145))
          );

          const lastY = Math.max(
            startY + 15,
            Math.min(y - 5, y + 20)
          );

          platforms.push({
            x: lastX,
            y: lastY,
            w: Math.max(115, W - lastX),
            h: 18,
            safe: true
          });

          x = W;
          break;
        }

        const gap = randInt(cfg.gapMin, cfg.gapMax);
        const platformWidth = randInt(
          cfg.platformMin,
          cfg.platformMax
        );

        // 위로 올라가는 발판과 내려가는 발판을 섞되 높이 차이는 제한한다.
        const heightChange = randInt(-35, 40);
        const nextY = Math.max(
          startY + 20,
          Math.min(GROUND_Y - 35, y + heightChange)
        );

        const nextX = x + gap;

        // 플레이어가 점프할 수 있는 거리를 넘으면 간격을 줄인다.
        const safeGap = Math.min(gap, 155);

        platforms.push({
          x: x + safeGap,
          y: nextY,
          w: platformWidth,
          h: 18,
          safe: false
        });

        x = x + safeGap + platformWidth;
        y = nextY;
      }

      // 마지막 구간은 항상 탈출구가 있는 안전 발판으로 연결한다.
      const lastPlatform = platforms[platforms.length - 1];

      if (lastPlatform && lastPlatform.x + lastPlatform.w < W - 70) {
        platforms.push({
          x: Math.min(W - 200, lastPlatform.x + lastPlatform.w + 75),
          y: Math.max(80, Math.min(GROUND_Y - 25, lastPlatform.y + 10)),
          w: W,
          h: 18,
          safe: true
        });
      }

      // 시작 발판과 끝 발판에는 가시를 배치하지 않는다.
      for (let i = 1; i < platforms.length - 1; i++) {
        const p = platforms[i];

        if (p.w < 120 || Math.random() > cfg.spikeChance) {
          continue;
        }

        const spikeW = currentFloor === 1 ? 30 : 27;
        const spikeH = currentFloor === 1 ? 31 : 27;

        const margin = Math.max(38, player.w * 0.8);
        const minX = p.x + margin;
        const maxX = p.x + p.w - margin - spikeW;

        if (maxX <= minX) continue;

        hazards.push({
          type: "spike",
          x: rand(minX, maxX),
          y: p.y - spikeH,
          w: spikeW,
          h: spikeH,
          platform: p
        });
      }

      // 층이 내려갈수록 움직이는 장애물이 늘어난다.
      for (let i = 0; i < cfg.movingCount; i++) {
        const candidatePlatforms = platforms.filter(
          p => p.w >= 130 && p.x > 160 && p.x < W - 160
        );

        if (candidatePlatforms.length === 0) break;

        const p = candidatePlatforms[
          randInt(0, candidatePlatforms.length - 1)
        ];

        const radius = currentFloor === 1 ? 27 : 23;

        movingHazards.push({
          type: "orb",
          baseX: p.x + p.w / 2,
          baseY: p.y - 65 - i * 12,
          x: p.x + p.w / 2,
          y: p.y - 65 - i * 12,
          r: radius,
          range: currentFloor === 1 ? 62 : 42,
          phase: rand(0, Math.PI * 2),
          speed: rand(1.3, 2.0) + (4 - currentFloor) * 0.15
        });
      }

      exitDoor = {
        x: W - 78,
        y: 40,
        w: 42,
        h: 58
      };
    }

    function startFloor(floor) {
      currentFloor = floor;
      generatePlatforms();

      resetPlayer(55, GROUND_Y - PLAYER_H);
      cameraY = 0;
      gameState = "playing";
      hideMessage();
      updateStatus();
    }

    function restartGame() {
      lives = 3;
      startFloor(4);
    }

    function jump() {
      if (gameState !== "playing") return;

      if (player.onGround) {
        player.vy = -FLOOR_SETTINGS[currentFloor].jumpPower;
        player.onGround = false;
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function getPlayerHitbox() {
      return {
        x: player.x + 15,
        y: player.y + 9,
        w: player.w - 30,
        h: player.h - 14
      };
    }

    function hitSpike(spike) {
      const p = getPlayerHitbox();

      // 가시의 밑부분을 좁게 잡아 모서리 스침 판정을 줄인다.
      const hitbox = {
        x: spike.x + spike.w * 0.27,
        y: spike.y + spike.h * 0.43,
        w: spike.w * 0.46,
        h: spike.h * 0.57
      };

      return rectsOverlap(p, hitbox);
    }

    function hitOrb(orb) {
      const p = getPlayerHitbox();

      const closestX = Math.max(
        p.x,
        Math.min(orb.x, p.x + p.w)
      );

      const closestY = Math.max(
        p.y,
        Math.min(orb.y, p.y + p.h)
      );

      const dx = orb.x - closestX;
      const dy = orb.y - closestY;

      // 실제 원보다 살짝 작은 충돌 반경을 사용한다.
      const safeRadius = orb.r * 0.78;

      return dx * dx + dy * dy < safeRadius * safeRadius;
    }

    function takeDamage() {
      if (invincibleTimer > 0 || gameState !== "playing") return;

      lives--;
      updateStatus();

      if (lives <= 0) {
        gameState = "over";
        showMessage("😵 야자 탈출 실패!", "하트가 모두 사라졌어. 다시 도전해 봐!");
        return;
      }

      // 피해를 받으면 현재 발판의 안전한 위치로 되돌린다.
      const nearest = platforms
        .filter(p => player.x + player.w > p.x && player.x < p.x + p.w)
        .sort((a, b) => Math.abs(a.y - player.y) - Math.abs(b.y - player.y))[0];

      if (nearest) {
        resetPlayer(
          Math.max(nearest.x + 5, Math.min(player.x, nearest.x + nearest.w - player.w - 5)),
          nearest.y - player.h
        );
      } else {
        resetPlayer(55, GROUND_Y - PLAYER_H);
      }
    }

    function update(dt) {
      if (gameState !== "playing") return;

      const cfg = FLOOR_SETTINGS[currentFloor];
      const step = Math.min(dt / 16.67, 2);

      animationTime += step;

      if (invincibleTimer > 0) {
        invincibleTimer -= step;
      }

      player.vx = 0;

      if (keys.left) {
        player.vx = -cfg.speed;
        player.facing = -1;
      }

      if (keys.right) {
        player.vx = cfg.speed;
        player.facing = 1;
      }

      player.x += player.vx * step;
      player.x = Math.max(0, Math.min(W - player.w, player.x));

      player.vy += cfg.gravity * step;
      player.vy = Math.min(player.vy, 17);
      player.y += player.vy * step;

      player.onGround = false;

      // 위에서 내려올 때만 발판에 착지하도록 처리한다.
      if (player.vy >= 0) {
        for (const p of platforms) {
          const previousBottom = player.y - player.vy * step + player.h;
          const currentBottom = player.y + player.h;

          const horizontalOverlap =
            player.x + player.w - 9 > p.x &&
            player.x + 9 < p.x + p.w;

          const crossedTop =
            previousBottom <= p.y + 4 &&
            currentBottom >= p.y &&
            currentBottom <= p.y + 22;

          if (horizontalOverlap && crossedTop) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            break;
          }
        }
      }

      for (const orb of movingHazards) {
        orb.x = orb.baseX +
          Math.sin(animationTime * 0.035 * orb.speed + orb.phase) * orb.range;

        orb.y = orb.baseY +
          Math.cos(animationTime * 0.026 * orb.speed + orb.phase) * 16;
      }

      for (const spike of hazards) {
        if (hitSpike(spike)) {
          takeDamage();
          break;
        }
      }

      if (gameState === "playing") {
        for (const orb of movingHazards) {
          if (hitOrb(orb)) {
            takeDamage();
            break;
          }
        }
      }

      // 아래로 떨어지면 목숨을 잃는다.
      if (player.y > H + 100) {
        takeDamage();

        if (gameState === "playing" && lives > 0) {
          resetPlayer(55, GROUND_Y - PLAYER_H);
        }
      }

      // 출구에 도착하면 다음 층으로 이동한다.
      if (
        exitDoor &&
        player.x + player.w > exitDoor.x &&
        player.x < exitDoor.x + exitDoor.w &&
        player.y + player.h > exitDoor.y &&
        player.y < exitDoor.y + exitDoor.h
      ) {
        if (currentFloor > 1) {
          startFloor(currentFloor - 1);
        } else {
          gameState = "win";
          showMessage("🎉 야자 탈출 성공!", "모든 층을 통과했어! 대단해!");
        }
      }

      if (player.vx !== 0) {
        player.frameTimer += step;

        if (player.frameTimer > 7) {
          player.frame = (player.frame + 1) % 4;
          player.frameTimer = 0;
        }
      } else {
        player.frame = 0;
      }
    }

    function drawBackground() {
      if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
        ctx.drawImage(backgroundImage, 0, 0, W, H);
        ctx.fillStyle = "rgba(255,255,255,0.10)";
        ctx.fillRect(0, 0, W, H);
      } else {
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, "#87ceeb");
        gradient.addColorStop(1, "#e7f4ff");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawPlatforms() {
      for (const p of platforms) {
        ctx.fillStyle = "#6b4b32";
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = "#77c95b";
        ctx.fillRect(p.x, p.y, p.w, 7);

        ctx.fillStyle = "rgba(0,0,0,0.13)";
        ctx.fillRect(p.x, p.y + 7, p.w, 3);
      }
    }

    function drawSpike(spike) {
      ctx.fillStyle = "#d7dce5";
      ctx.beginPath();
      ctx.moveTo(spike.x, spike.y + spike.h);
      ctx.lineTo(spike.x + spike.w / 2, spike.y);
      ctx.lineTo(spike.x + spike.w, spike.y + spike.h);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#697386";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#f6f7fb";
      ctx.beginPath();
      ctx.moveTo(spike.x + spike.w * 0.43, spike.y + spike.h * 0.52);
      ctx.lineTo(spike.x + spike.w / 2, spike.y + 4);
      ctx.lineTo(spike.x + spike.w * 0.60, spike.y + spike.h * 0.52);
      ctx.closePath();
      ctx.fill();
    }

    function drawMovingHazards() {
      for (const orb of movingHazards) {
        const gradient = ctx.createRadialGradient(
          orb.x - orb.r * 0.3,
          orb.y - orb.r * 0.3,
          2,
          orb.x,
          orb.y,
          orb.r
        );

        gradient.addColorStop(0, "#ffb0b0");
        gradient.addColorStop(1, "#e63946");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#8d1520";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(orb.x - 6, orb.y - 6, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawExit() {
      if (!exitDoor) return;

      ctx.fillStyle = "#33415c";
      ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);

      ctx.fillStyle = "#ffd166";
      ctx.fillRect(exitDoor.x + 6, exitDoor.y + 7, exitDoor.w - 12, exitDoor.h - 7);

      ctx.fillStyle = "#8d5524";
      ctx.fillRect(exitDoor.x + 11, exitDoor.y + 15, exitDoor.w - 22, exitDoor.h - 15);

      ctx.fillStyle = "#fff3b0";
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "center";
      ctx.fillText("EXIT", exitDoor.x + exitDoor.w / 2, exitDoor.y - 8);
    }

    function drawPlayer() {
      // character.png가 4열 x 2행 스프라이트 시트라고 가정한다.
      if (characterImage.complete && characterImage.naturalWidth > 0) {
        const frameW = characterImage.naturalWidth / 4;
        const frameH = characterImage.naturalHeight / 2;

        const row = player.onGround ? 0 : 1;
        const col = player.frame % 4;

        ctx.save();

        if (player.facing < 0) {
          ctx.translate(player.x + player.w, player.y);
          ctx.scale(-1, 1);

          ctx.drawImage(
            characterImage,
            col * frameW,
            row * frameH,
            frameW,
            frameH,
            0,
            0,
            player.w,
            player.h
          );
        } else {
          ctx.drawImage(
            characterImage,
            col * frameW,
            row * frameH,
            frameW,
            frameH,
            player.x,
            player.y,
            player.w,
            player.h
          );
        }

        ctx.restore();
      } else {
        ctx.fillStyle = "#3157a4";
        ctx.fillRect(player.x + 7, player.y + 20, player.w - 14, player.h - 20);

        ctx.fillStyle = "#f1c6a8";
        ctx.fillRect(player.x + 10, player.y, player.w - 20, 24);

        ctx.fillStyle = "#222";
        ctx.fillRect(player.x + 15, player.y + 8, 4, 4);
        ctx.fillRect(player.x + 28, player.y + 8, 4, 4);
      }

      if (invincibleTimer > 0 && Math.floor(invincibleTimer / 5) % 2 === 0) {
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.fillRect(player.x, player.y, player.w, player.h);
      }
    }

    function drawDifficultyIndicator() {
      const cfg = FLOOR_SETTINGS[currentFloor];

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(12, 12, 190, 48);

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "left";
      ctx.font = "bold 15px Arial";
      ctx.fillText(currentFloor + "층 · " + cfg.name, 22, 32);

      ctx.font = "12px Arial";
      const warning = currentFloor === 4
        ? "기본 조작 익히기"
        : currentFloor === 3
        ? "가시를 조심해!"
        : currentFloor === 2
        ? "움직이는 장애물 주의"
        : "최종 구간! 집중!";
      ctx.fillText(warning, 22, 49);
    }

    function draw() {
      drawBackground();
      drawPlatforms();

      for (const spike of hazards) {
        drawSpike(spike);
      }

      drawMovingHazards();
      drawExit();
      drawPlayer();
      drawDifficultyIndicator();
    }

    function gameLoop(time) {
      const dt = lastTime === 0 ? 16.67 : time - lastTime;
      lastTime = time;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", event => {
      if (
        ["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)
      ) {
        event.preventDefault();
      }

      if (event.code === "ArrowLeft" || event.code === "KeyA") {
        keys.left = true;
      }

      if (event.code === "ArrowRight" || event.code === "KeyD") {
        keys.right = true;
      }

      if (
        (event.code === "Space" || event.code === "ArrowUp" || event.code === "KeyW") &&
        !jumpPressed
      ) {
        jumpPressed = true;
        jump();
      }
    });

    window.addEventListener("keyup", event => {
      if (event.code === "ArrowLeft" || event.code === "KeyA") {
        keys.left = false;
      }

      if (event.code === "ArrowRight" || event.code === "KeyD") {
        keys.right = false;
      }

      if (
        event.code === "Space" ||
        event.code === "ArrowUp" ||
        event.code === "KeyW"
      ) {
        jumpPressed = false;
      }
    });

    function bindHoldButton(id, keyName) {
      const button = document.getElementById(id);

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys[keyName] = true;
        button.setPointerCapture(event.pointerId);
      });

      const release = event => {
        event.preventDefault();
        keys[keyName] = false;
      };

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", () => {
        keys[keyName] = false;
      });
    }

    bindHoldButton("left-btn", "left");
    bindHoldButton("right-btn", "right");

    document.getElementById("jump-btn").addEventListener("pointerdown", event => {
      event.preventDefault();
      jump();
    });

    document.getElementById("restart-btn").addEventListener("click", restartGame);

    // 게임 시작
    startFloor(4);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
