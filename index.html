<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야자 탈출</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #222;
      overflow: hidden;
      font-family: sans-serif;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #b8d9ef;
    }

    #nextFloor {
      display: none;
      position: fixed;
      right: 20px;
      top: 20px;
      z-index: 10;
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      background: #ffcf45;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #help {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 5;
      padding: 8px 12px;
      border-radius: 8px;
      background: #0009;
      color: white;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="help">← → 방향키 또는 A / D 로 이동</div>
  <button id="nextFloor">다음 층으로 ▶</button>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const nextButton = document.getElementById("nextFloor");

    const bg = new Image();
    const sprite = new Image();

    bg.src = "school.png";
    sprite.src = "character.png";

    // 맵 확대 배율
    const ZOOM = 3;

    // 맵을 아래로 내리는 정도. 값이 클수록 아래로 내려감.
    const BACKGROUND_DOWN = 30;

    let screenW = window.innerWidth;
    let screenH = window.innerHeight;

    let bgWidth = 0;
    let bgHeight = 0;
    let mapWidth = 0;
    let cameraX = 0;

    const keys = {};

    const player = {
      x: 60,
      y: 0,
      w: 72,
      h: 100,
      speed: 5,
      frame: 0,
      animTimer: 0,
      moving: false
    };

    const groundY = 0;
    let floorY = 0;
    let reachedEnd = false;
    let imagesReady = false;
    let lastTime = 0;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      screenW = window.innerWidth;
      screenH = window.innerHeight;

      canvas.width = Math.round(screenW * dpr);
      canvas.height = Math.round(screenH * dpr);
      canvas.style.width = screenW + "px";
      canvas.style.height = screenH + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      setupMap();
    }

    function setupMap() {
      if (!bg.complete || !bg.naturalWidth ||
          !sprite.complete || !sprite.naturalWidth) {
        return;
      }

      // 원본 이미지 비율을 유지하며 3배 확대
      bgWidth = bg.naturalWidth * ZOOM;
      bgHeight = bg.naturalHeight * ZOOM;

      mapWidth = Math.max(screenW, bgWidth);

      // 맵의 아래쪽이 화면 밖으로 사라지지 않도록 위치 제한
      const desiredY = BACKGROUND_DOWN;
      const minY = screenH - bgHeight;
      const maxY = screenH * 0.35;

      window.bgY = Math.max(minY, Math.min(desiredY, maxY));

      // 캐릭터가 서 있을 바닥
      floorY = Math.round(screenH * 0.82);
      player.y = floorY - player.h;

      player.x = Math.min(player.x, mapWidth - player.w);
      cameraX = Math.max(
        0,
        Math.min(player.x - screenW * 0.3, mapWidth - screenW)
      );

      imagesReady = true;
    }

    bg.onload = setupMap;
    sprite.onload = setupMap;

    bg.onerror = () => {
      console.error("school.png를 불러오지 못했습니다.");
    };

    sprite.onerror = () => {
      console.error("character.png를 불러오지 못했습니다.");
    };

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    window.addEventListener("keydown", (e) => {
      if ([
        "ArrowLeft", "ArrowRight", "a", "A", "d", "D"
      ].includes(e.key)) {
        e.preventDefault();
      }

      keys[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    nextButton.addEventListener("click", () => {
      player.x = 0;
      cameraX = 0;
      reachedEnd = false;
      nextButton.style.display = "none";
      setupMap();
    });

    function update(delta) {
      if (!imagesReady || reachedEnd) return;

      const oldX = player.x;
      const step = player.speed * Math.min(delta / 16.67, 2);

      if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player.x += step;
      }

      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
        player.x -= step;
      }

      player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
      player.moving = Math.abs(player.x - oldX) > 0;

      if (player.moving) {
        player.animTimer += delta;

        if (player.animTimer > 100) {
          player.frame = (player.frame + 1) % 4;
          player.animTimer = 0;
        }
      } else {
        player.frame = 0;
        player.animTimer = 0;
      }

      cameraX = player.x - screenW * 0.3;
      cameraX = Math.max(0, Math.min(cameraX, mapWidth - screenW));

      if (player.x >= mapWidth - player.w - 2) {
        reachedEnd = true;
        nextButton.style.display = "block";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, screenW, screenH);

      // 하늘색 배경은 이미지가 화면을 채우지 못할 때 보임
      ctx.fillStyle = "#b8d9ef";
      ctx.fillRect(0, 0, screenW, screenH);

      if (!imagesReady) {
        ctx.fillStyle = "#222";
        ctx.font = "20px sans-serif";
        ctx.fillText("이미지를 불러오는 중...", 20, 60);
        return;
      }

      // 맵을 카메라 위치에 맞춰 그림
      ctx.drawImage(
        bg,
        -cameraX,
        window.bgY,
        bgWidth,
        bgHeight
      );

      // 바닥
      ctx.fillStyle = "#494949";
      ctx.fillRect(0, floorY, screenW, screenH - floorY);

      // 캐릭터 스프라이트 시트: 4열 x 2행
      const cols = 4;
      const rows = 2;
      const frameW = sprite.naturalWidth / cols;
      const frameH = sprite.naturalHeight / rows;

      const frameX = player.frame % cols;
      const frameY = 0;

      ctx.drawImage(
        sprite,
        frameX * frameW,
        frameY * frameH,
        frameW,
        frameH,
        player.x - cameraX,
        player.y,
        player.w,
        player.h
      );

      if (reachedEnd) {
        ctx.fillStyle = "#0009";
        ctx.fillRect(0, 0, screenW, screenH);
        ctx.fillStyle = "white";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("복도 끝에 도착했다!", screenW / 2, screenH / 2);
        ctx.textAlign = "left";
      }
    }

    function loop(time) {
      const delta = lastTime ? time - lastTime : 16.67;
      lastTime = time;

      update(delta);
      draw();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
