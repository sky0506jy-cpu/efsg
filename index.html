<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>야자 탈출</title>

  <style>
    body {
      margin: 0;
      background: #171b25;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 14px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: auto;
      border: 2px solid #687287;
      background: #252a35;
    }

    #info {
      margin: 12px;
    }

    button {
      display: none;
      margin: 14px auto;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #ffca55;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>🏫 야자 탈출</h1>

  <p id="info">방향키 또는 A/D: 이동 · 스페이스바: 점프</p>

  <canvas id="game" width="960" height="540"></canvas>

  <button id="next">다음 층으로 내려가기 ↓</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const nextButton = document.getElementById("next");

    const bg = new Image();
    const sprite = new Image();

    bg.src = "school.png";
    sprite.src = "character.png";

    // 게임 설정
    const FLOOR_COUNT = 4;
    const BACKGROUND_ZOOM = 1.25;

    let floor = 1;
    let ready = false;
    let finished = false;

    // 맵 설정
    let mapWidth = 3000;
    let bgWidth = 0;
    let bgHeight = 0;
    let groundY = 445;
    let cameraX = 0;

    // 캐릭터 설정
    const player = {
      x: 40,
      y: 0,
      w: 72,
      h: 100,
      speed: 5,
      vy: 0,
      jumpPower: -14,
      grounded: false
    };

    const keys = {};

    // 애니메이션 설정
    let animationFrame = 0;
    let animationTimer = 0;
    const FRAME_DELAY = 8;

    // 프레임마다 캐릭터가 위아래로 흔들리는 것을 줄이기 위해
    // 모든 프레임을 같은 크기의 영역에 그림
    const SPRITE_COLUMNS = 4;
    const SPRITE_ROWS = 2;

    function setupMap() {
      if (!bg.complete || !bg.naturalWidth ||
          !sprite.complete || !sprite.naturalWidth) {
        return;
      }

      // 배경 원본 비율 유지
      bgHeight = canvas.height * BACKGROUND_ZOOM;
      bgWidth = bg.naturalWidth * bgHeight / bg.naturalHeight;

      // 맵 길이는 배경 그림의 가로 비율과 별개로 설정
      mapWidth = Math.max(canvas.width * 3, bgWidth * 3);

      player.y = groundY - player.h;
      ready = true;
    }

    bg.onload = setupMap;
    sprite.onload = setupMap;

    // 키보드 입력
    window.addEventListener("keydown", function(e) {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (e.code === "Space" || key.startsWith("arrow")) {
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", function(e) {
      keys[e.key.toLowerCase()] = false;
    });

    // 다음 층으로 이동
    nextButton.addEventListener("click", function() {
      if (floor >= FLOOR_COUNT) {
        finished = true;
        nextButton.style.display = "none";
        info.textContent = "🎉 야자 탈출 성공!";
        return;
      }

      floor++;
      player.x = 40;
      player.y = groundY - player.h;
      player.vy = 0;
      player.grounded = false;
      cameraX = 0;
      animationFrame = 0;
      animationTimer = 0;

      finished = false;
      nextButton.style.display = "none";
      info.textContent = floor + "층 복도";
    });

    function update() {
      if (!ready || finished) return;

      const moving =
        keys["arrowright"] || keys["d"] ||
        keys["arrowleft"] || keys["a"];

      if (keys["arrowright"] || keys["d"]) {
        player.x += player.speed;
      }

      if (keys["arrowleft"] || keys["a"]) {
        player.x -= player.speed;
      }

      // 맵 밖으로 나가지 못하게 함
      player.x = Math.max(0, Math.min(
        player.x,
        mapWidth - player.w
      ));

      // 점프
      if ((keys[" "] || keys["space"]) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      // 중력
      player.vy += 0.7;
      player.y += player.vy;

      // 바닥 충돌
      if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      // 카메라가 캐릭터를 따라감
      cameraX = player.x - canvas.width * 0.35;
      cameraX = Math.max(0, Math.min(
        cameraX,
        mapWidth - canvas.width
      ));

      // 걷는 중에만 애니메이션 변경
      if (moving && player.grounded) {
        animationTimer++;

        if (animationTimer >= FRAME_DELAY) {
          animationFrame = (animationFrame + 1) %
            (SPRITE_COLUMNS * SPRITE_ROWS);
          animationTimer = 0;
        }
      } else {
        // 멈추면 첫 프레임으로 돌아감
        animationFrame = 0;
        animationTimer = 0;
      }

      // 맵 끝에서 다음 층 버튼 표시
      if (player.x >= mapWidth - player.w - 2) {
        nextButton.style.display = "block";
        info.textContent = "맵 끝에 도착했어! 다음 층으로 내려가자.";
      } else {
        nextButton.style.display = "none";
        info.textContent = floor + "층 · 오른쪽 끝까지 달려가자!";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!ready) {
        ctx.fillStyle = "white";
        ctx.font = "22px sans-serif";
        ctx.fillText("이미지 불러오는 중...", 350, 270);
        return;
      }

      // 배경 그리기: 원본 비율을 유지하며 확대
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, groundY);
      ctx.clip();

      const bgY = groundY - bgHeight;

      ctx.drawImage(
        bg,
        0, 0, bg.naturalWidth, bg.naturalHeight,
        -cameraX, bgY, bgWidth, bgHeight
      );

      // 배경 이미지가 끝난 뒤에는 단색으로 표시
      if (bgWidth - cameraX < canvas.width) {
        ctx.fillStyle = "#343b49";
        ctx.fillRect(
          Math.max(0, bgWidth - cameraX),
          0,
          canvas.width,
          groundY
        );
      }

      ctx.restore();

      // 바닥
      ctx.fillStyle = "#343b49";
      ctx.fillRect(
        0,
        groundY,
        canvas.width,
        canvas.height - groundY
      );

      // 캐릭터 스프라이트
      const frameW = sprite.naturalWidth / SPRITE_COLUMNS;
      const frameH = sprite.naturalHeight / SPRITE_ROWS;

      const col = animationFrame % SPRITE_COLUMNS;
      const row = Math.floor(animationFrame / SPRITE_COLUMNS);

      // 모든 프레임을 동일한 위치와 크기로 그림
      ctx.drawImage(
        sprite,
        col * frameW,
        row * frameH,
        frameW,
        frameH,
        Math.round(player.x - cameraX),
        Math.round(player.y),
        player.w,
        player.h
      );

      // 진행 표시
      const progress = player.x / (mapWidth - player.w);

      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(20, 20, 220, 16);

      ctx.fillStyle = "#ffca55";
      ctx.fillRect(20, 20, 220 * progress, 16);

      ctx.fillStyle = "white";
      ctx.font = "14px sans-serif";
      ctx.fillText(
        floor + "층 · " + Math.floor(progress * 100) + "%",
        20,
        55
      );
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    bg.onerror = function() {
      info.textContent =
        "school.png 파일을 찾을 수 없어. 파일 이름을 확인해 줘.";
    };

    sprite.onerror = function() {
      info.textContent =
        "character.png 파일을 찾을 수 없어. 파일 이름을 확인해 줘.";
    };

    gameLoopStart();

    function gameLoopStart() {
      requestAnimationFrame(function run() {
        update();
        draw();
        requestAnimationFrame(run);
      });
    }
  </script>
</body>
</html>
