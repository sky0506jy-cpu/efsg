<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야자 탈출</title>

  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #171b25;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 960px;
      height: auto;
      margin: auto;
      border: 2px solid #687287;
      background: #303747;
    }

    button {
      display: none;
      margin: 14px auto;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #ffca55;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>🏫 야자 탈출</h1>
  <p id="info">방향키 또는 A/D: 이동 · 스페이스바: 점프</p>

  <canvas id="game" width="960" height="540"></canvas>
  <button id="next">다음 층으로 내려가기 ↓</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const nextButton = document.getElementById("next");

    const bg = new Image();
    const sprite = new Image();

    // 배경 확대 설정
    const ZOOM = 3;

    // 배경을 아래로 내리는 값
    // 숫자를 높이면 배경이 더 아래로 내려감
    const BACKGROUND_DOWN = 180;

    const FLOOR_COUNT = 4;

    let floor = 1;
    let ready = false;
    let finished = false;

    let bgWidth = 0;
    let bgHeight = 0;
    let bgY = 0;
    let mapWidth = 2880;
    let cameraX = 0;

    // 캐릭터 설정
    const player = {
      x: 40,
      y: 0,
      w: 72,
      h: 100,
      speed: 5,
      vy: 0,
      jumpPower: -14,
      grounded: false
    };

    const keys = {};
    let frame = 0;
    let frameTimer = 0;
    let lastTime = 0;

    // 이미지가 준비되면 맵 설정
    function setupMap() {
      if (!bg.naturalWidth || !sprite.naturalWidth) return;

      // 이미지 원래 비율을 유지하며 3배 확대
      bgHeight = bg.naturalHeight * ZOOM;
      bgWidth = bg.naturalWidth * ZOOM;

      // 배경 위치를 아래로 이동
      bgY = BACKGROUND_DOWN;

      // 배경 이미지가 실제로 보이는 구간까지만 이동
      mapWidth = Math.max(canvas.width, bgWidth);

      // 바닥 위치
      player.y = 440 - player.h;
      player.vy = 0;
      player.grounded = true;

      ready = true;
    }

    bg.onload = setupMap;
    sprite.onload = setupMap;

    // 키보드 입력
    window.addEventListener("keydown", function(e) {
      const key = e.key.toLowerCase();

      if (e.code === "Space" || key.startsWith("arrow")) {
        e.preventDefault();
      }

      keys[key] = true;
    });

    window.addEventListener("keyup", function(e) {
      keys[e.key.toLowerCase()] = false;
    });

    // 다음 층 이동
    nextButton.addEventListener("click", function() {
      if (floor >= FLOOR_COUNT) {
        finished = true;
        nextButton.style.display = "none";
        info.textContent = "🎉 야자 탈출 성공!";
        return;
      }

      floor++;
      player.x = 40;
      player.y = 440 - player.h;
      player.vy = 0;
      player.grounded = true;

      cameraX = 0;
      frame = 0;
      frameTimer = 0;
      finished = false;

      nextButton.style.display = "none";
      info.textContent = floor + "층 복도";
    });

    function update() {
      if (!ready || finished) return;

      const left = keys["arrowleft"] || keys["a"];
      const right = keys["arrowright"] || keys["d"];
      const moving = left || right;

      if (left) player.x -= player.speed;
      if (right) player.x += player.speed;

      // 맵 끝을 벗어나지 않게 제한
      player.x = Math.max(
        0,
        Math.min(player.x, mapWidth - player.w)
      );

      // 점프
      if ((keys[" "] || keys["space"]) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      // 중력
      player.vy += 0.7;
      player.y += player.vy;

      // 바닥 충돌
      const groundY = 440;

      if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      // 카메라가 캐릭터를 따라감
      cameraX = player.x - canvas.width * 0.35;
      cameraX = Math.max(
        0,
        Math.min(cameraX, mapWidth - canvas.width)
      );

      // 걷기 애니메이션
      if (moving && player.grounded) {
        frameTimer++;

        if (frameTimer >= 8) {
          frame = (frame + 1) % 8;
          frameTimer = 0;
        }
      } else {
        frame = 0;
        frameTimer = 0;
      }

      // 맵 끝에 도착하면 다음 층 버튼 표시
      if (player.x >= mapWidth - player.w - 1) {
        nextButton.style.display = "block";
        info.textContent = "맵 끝이야! 다음 층으로 내려가자.";
      } else {
        nextButton.style.display = "none";
        info.textContent = floor + "층 · 오른쪽으로 이동하자!";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!ready) {
        ctx.fillStyle = "white";
        ctx.font = "22px sans-serif";
        ctx.fillText("이미지 불러오는 중...", 350, 270);
        return;
      }

      // 배경 그리기
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.clip();

      ctx.drawImage(
        bg,
        0, 0, bg.naturalWidth, bg.naturalHeight,
        -cameraX, bgY, bgWidth, bgHeight
      );

      // 배경 이미지가 끝나면 어두운 색으로 채움
      const endOnScreen = bgWidth - cameraX;

      if (endOnScreen < canvas.width) {
        ctx.fillStyle = "#303747";
        ctx.fillRect(
          Math.max(0, endOnScreen),
          0,
          canvas.width,
          canvas.height
        );
      }

      ctx.restore();

      // 바닥
      ctx.fillStyle = "#343b49";
      ctx.fillRect(
        0,
        440,
        canvas.width,
        canvas.height - 440
      );

      // 캐릭터 그리기
      const fw = sprite.naturalWidth / 4;
      const fh = sprite.naturalHeight / 2;

      const col = frame % 4;
      const row = Math.floor(frame / 4);

      ctx.drawImage(
        sprite,
        col * fw,
        row * fh,
        fw,
        fh,
        Math.round(player.x - cameraX),
        Math.round(player.y),
        player.w,
        player.h
      );
    }

    function loop(time) {
      if (time - lastTime >= 16) {
        update();
        draw();
        lastTime = time;
      }

      requestAnimationFrame(loop);
    }

    bg.onerror = function() {
      info.textContent = "school.png 파일 이름을 확인해 줘.";
    };

    sprite.onerror = function() {
      info.textContent = "character.png 파일 이름을 확인해 줘.";
    };

    // 이미지 파일 불러오기
    bg.src = "school.png";
    sprite.src = "character.png";

    requestAnimationFrame(loop);
  </script>
</body>
</html>
