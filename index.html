<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
  body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    display: block;
    width: min(960px, 100%);
    height: auto;
    margin: 20px auto;
    background: #101522;
  }
  button {
    padding: 12px 20px;
    margin: 5px;
    font-size: 18px;
  }
</style>
</head>
<body>
<h1>🏫 야자 탈출</h1>
<p>← → 이동 · Space 점프</p>
<canvas id="game" width="960" height="540"></canvas>
<button id="left">⬅ 왼쪽</button>
<button id="jump">점프</button>
<button id="right">오른쪽 ➡</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "school.png";

const sprite = new Image();
sprite.src = "character.png";

const player = {
  x: 100, y: 300,
  w: 100, h: 115,
  vx: 0, vy: 0,
  speed: 4,
  grounded: false,
  frame: 0,
  tick: 0,
  facing: 1
};

const keys = {};
const gravity = 0.55;
const groundY = 450;
let cameraX = 0;
const worldWidth = 4000;

window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  if ([" ", "arrowleft", "arrowright"].includes(key)) {
    e.preventDefault();
  }

  if ((e.code === "Space" || e.key === "ArrowUp")
      && player.grounded) {
    player.vy = -12;
    player.grounded = false;
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function holdButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;

    if (key === "jump" && player.grounded) {
      player.vy = -12;
      player.grounded = false;
    }
  });

  for (const event of ["pointerup", "pointerleave",
                       "pointercancel"]) {
    button.addEventListener(event, () => {
      keys[key] = false;
    });
  }
}

holdButton("left", "arrowleft");
holdButton("right", "arrowright");
holdButton("jump", "jump");

function update() {
  player.vx = 0;

  if (keys["arrowleft"] || keys["a"]) {
    player.vx = -player.speed;
    player.facing = -1;
  }

  if (keys["arrowright"] || keys["d"]) {
    player.vx = player.speed;
    player.facing = 1;
  }

  player.x += player.vx;
  player.x = Math.max(0, Math.min(
    worldWidth - player.w, player.x
  ));

  player.vy += gravity;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  if (player.vx !== 0) {
    player.tick++;
    if (player.tick % 8 === 0) {
      player.frame = (player.frame + 1) % 8;
    }
  } else {
    player.frame = 0;
  }

  // 캐릭터가 화면 중앙에 오면 배경을 움직임
  cameraX = player.x - 300;
  cameraX = Math.max(0, Math.min(
    worldWidth - canvas.width, cameraX
  ));
}

function draw() {
  ctx.clearRect(0, 0, 960, 540);

  // 학교 배경을 가로로 이어 붙여 스크롤
  if (bg.complete && bg.naturalWidth > 0) {
    const scale = 540 / bg.naturalHeight;
    const bgWidth = bg.naturalWidth * scale;
    const offset = cameraX % bgWidth;

    for (let x = -offset; x < 960; x += bgWidth) {
      ctx.drawImage(bg, x, 0, bgWidth, 540);
    }
  } else {
    ctx.fillStyle = "#182238";
    ctx.fillRect(0, 0, 960, 540);
  }

  // 바닥
  ctx.fillStyle = "#343b4d";
  ctx.fillRect(0, groundY, 960, 90);

  // 캐릭터
  if (sprite.complete && sprite.naturalWidth > 0) {
    const fw = sprite.naturalWidth / 4;
    const cellH = sprite.naturalHeight / 2;
    const fh = cellH * 0.88;
    const col = player.frame % 4;
    const row = Math.floor(player.frame / 4);
    const screenX = player.x - cameraX;

    ctx.save();

    if (player.facing === -1) {
      ctx.translate(screenX + player.w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(
        sprite,
        col * fw, row * cellH, fw, fh,
        0, player.y, player.w, player.h
      );
    } else {
      ctx.drawImage(
        sprite,
        col * fw, row * cellH, fw, fh,
        screenX, player.y, player.w, player.h
      );
    }

    ctx.restore();
  }

  ctx.fillStyle = "white";
  ctx.font = "20px sans-serif";
  ctx.fillText("4층 - 야자 탈출!", 20, 35);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
