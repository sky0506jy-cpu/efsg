<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101525;
  font-family: sans-serif;
}
canvas { display: block; width: 100vw; height: 100vh; }
#help {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 10px;
  color: white;
  background: #000b;
  line-height: 1.6;
  font-size: 14px;
}
#nextFloor {
  display: none;
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 3;
  padding: 13px 20px;
  border: 0;
  border-radius: 10px;
  background: #ffd34e;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="help">← → / A D : 이동<br>Space / ↑ : 점프</div>
<button id="nextFloor">다음 층으로 ▶</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextButton = document.getElementById("nextFloor");

const school = new Image();
const character = new Image();
school.src = "./school.png";
character.src = "./character.png";

const keys = {};
let W = innerWidth, H = innerHeight;
let dpr = devicePixelRatio || 1;
let ready = false;
let finished = false;
let lastTime = 0;

let mapWidth = 0;
let mapHeight = 0;
let mapY = 0;
let floorY = 0;
let cameraX = 0;

// 발판 목록
let platforms = [];

// 크기 조절
const MAP_SCALE = 3.0;
const PLAYER_W = 100;
const PLAYER_H = 120;

const player = {
  x: 40,
  y: 0,
  w: PLAYER_W,
  h: PLAYER_H,
  speed: 5,
  facing: 1,
  frame: 0,
  animTime: 0,
  moving: false,
  velocityY: 0,
  jumpPower: 14,
  onGround: true
};

// 발판 생성
function generatePlatforms() {
  platforms = [];

  // 발판 높이와 간격을 다양하게 배치
  const startX = 340;
  const endX = mapWidth - 250;
  const total = Math.max(10, Math.floor((endX - startX) / 260));

  for (let i = 0; i < total; i++) {
    const progress = i / Math.max(1, total - 1);
    const x = startX + progress * (endX - startX);

    // 발판 높이 패턴
    const pattern = i % 6;
    let height;

    if (pattern === 0) height = 100;
    else if (pattern === 1) height = 155;
    else if (pattern === 2) height = 125;
    else if (pattern === 3) height = 185;
    else if (pattern === 4) height = 115;
    else height = 150;

    // 마지막 구간도 지나치게 높아지지 않게 유지
    height = Math.min(height, 190);

    // 발판 너비를 다양하게 구성
    let width;

    if (i % 5 === 0) width = 190;
    else if (i % 3 === 0) width = 125;
    else if (i % 4 === 0) width = 105;
    else width = 150;

    // 점프할 수 있는 범위 안에서 높이 배치
    const y = floorY - height;

    platforms.push({
      x: x,
      y: y,
      w: width,
      h: 22
    });

    // 일부 구간에 보조 발판 추가
    if (i % 4 === 1 && i < total - 1) {
      platforms.push({
        x: x + width + 65,
        y: y + 35,
        w: 105,
        h: 22
      });
    }
  }

  // 출발 지점의 발판
  platforms.unshift({
    x: 175,
    y: floorY - 95,
    w: 135,
    h: 22
  });

  // 출발 발판과 첫 번째 발판 사이의 중간 발판
  platforms.unshift({
    x: 40,
    y: floorY - 55,
    w: 115,
    h: 22
  });

  // 도착 지점 발판
  platforms.push({
    x: mapWidth - 230,
    y: floorY - 70,
    w: 180,
    h: 22
  });
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
}

function setup() {
  if (!school.naturalWidth || !character.naturalWidth) return;

  mapWidth = Math.max(W, school.naturalWidth * MAP_SCALE);
  mapHeight = school.naturalHeight * MAP_SCALE;

  // 복도 이미지 전체의 여백을 고려해 세로 위치 조정
  mapY = H * -0.98;

  floorY = H * 0.84;

  // 화면 크기가 바뀔 때도 기존 위치와 크기 유지
  player.y = Math.min(player.y, floorY - player.h);
  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));

  // 발판 생성
  generatePlatforms();

  cameraX = Math.max(0, Math.min(player.x - W * 0.3, mapWidth - W));
  ready = true;
}

school.onload = setup;
character.onload = setup;

school.onerror = () => {
  document.getElementById("help").textContent =
    "school.png 파일을 불러올 수 없어요.";
};
character.onerror = () => {
  document.getElementById("help").textContent =
    "character.png 파일을 불러올 수 없어요.";
};

addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp"," ","a","A","d","D"].includes(e.key)) {
    e.preventDefault();
  }

  if (
    (e.code === "Space" || e.key === "ArrowUp") &&
    !keys[e.code] &&
    player.onGround &&
    !finished
  ) {
    player.velocityY = -player.jumpPower;
    player.onGround = false;
  }

  keys[e.key] = true;
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.code] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
});

nextButton.addEventListener("click", () => {
  player.x = 0;
  player.velocityY = 0;
  player.onGround = true;
  player.facing = 1;
  player.frame = 0;
  cameraX = 0;
  finished = false;
  nextButton.style.display = "none";
  player.y = floorY - player.h;
});

function update(dt) {
  if (!ready || finished) return;

  const factor = Math.min(dt / 16.67, 2);
  const oldX = player.x;
  const previousBottom = player.y + player.h;
  const previousY = player.y;

  if (keys.ArrowRight || keys.d || keys.D) {
    player.x += player.speed * factor;
    player.facing = 1;
  }

  if (keys.ArrowLeft || keys.a || keys.A) {
    player.x -= player.speed * factor;
    player.facing = -1;
  }

  player.x = Math.max(0, Math.min(player.x, mapWidth - player.w));
  player.moving = Math.abs(player.x - oldX) > 0;

  // 바닥이나 발판에서 벗어나면 떨어지기 시작
  if (player.onGround) {
    let supported = player.y + player.h >= floorY - 1;

    for (const p of platforms) {
      const horizontalOverlap =
        player.x + player.w - 8 > p.x &&
        player.x + 8 < p.x + p.w;

      const standingOnPlatform =
        Math.abs(player.y + player.h - p.y) <= 3;

      if (horizontalOverlap && standingOnPlatform) {
        supported = true;
        break;
      }
    }

    if (!supported) {
      player.onGround = false;
    }
  }

  // 중력과 점프
  if (!player.onGround) {
    player.velocityY += 0.65 * factor;
    player.y += player.velocityY * factor;

    // 바닥 착지
    if (player.y + player.h >= floorY) {
      player.y = floorY - player.h;
      player.velocityY = 0;
      player.onGround = true;
    }

    // 발판 착지: 위에서 내려오는 경우에만 판정
    if (player.velocityY >= 0) {
      for (const p of platforms) {
        const horizontalOverlap =
          player.x + player.w - 8 > p.x &&
          player.x + 8 < p.x + p.w;

        const crossedPlatformTop =
          previousBottom <= p.y &&
          player.y + player.h >= p.y;

        if (horizontalOverlap && crossedPlatformTop) {
          player.y = p.y - player.h;
          player.velocityY = 0;
          player.onGround = true;
          break;
        }
      }
    }
  }

  if (player.moving && player.onGround) {
    player.animTime += dt;

    if (player.animTime >= 110) {
      player.frame = (player.frame + 1) % 4;
      player.animTime = 0;
    }
  } else if (!player.onGround) {
    player.frame = 2;
  } else {
    player.frame = 0;
    player.animTime = 0;
  }

  cameraX = player.x - W * 0.3;
  cameraX = Math.max(0, Math.min(cameraX, mapWidth - W));

  if (player.x >= mapWidth - player.w - 1) {
    finished = true;
    nextButton.style.display = "block";
  }
}

// 발판 그리기
function drawPlatform(p) {
  const x = p.x - cameraX;

  // 발판 본체
  ctx.fillStyle = "#293d59";
  ctx.fillRect(x, p.y, p.w, p.h);

  // 발판 윗면
  ctx.fillStyle = "#75b9e7";
  ctx.fillRect(x, p.y, p.w, 5);

  // 테두리
  ctx.strokeStyle = "#a4dcff";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, p.y, p.w, p.h);

  // 발판 아래쪽 그림자
  ctx.fillStyle = "#111a2a";
  ctx.fillRect(x + 4, p.y + p.h, p.w - 8, 4);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#101525";
  ctx.fillRect(0, 0, W, H);

  if (!ready) {
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("이미지를 불러오는 중...", 20, 60);
    return;
  }

  // 맵은 반복하지 않고 한 번만 표시
  ctx.drawImage(
    school,
    -cameraX,
    mapY,
    school.naturalWidth * MAP_SCALE,
    mapHeight
  );

  // 바닥
  ctx.fillStyle = "#343434";
  ctx.fillRect(0, floorY, W, H - floorY);

  // 발판 그리기
  for (const p of platforms) {
    if (
      p.x - cameraX < W + 100 &&
      p.x - cameraX + p.w > -100
    ) {
      drawPlatform(p);
    }
  }

  // 스프라이트 4열 x 2행. 숫자가 있는 아래쪽은 사용하지 않음.
  const frameW = character.naturalWidth / 4;
  const frameH = character.naturalHeight / 2;
  const sx = player.frame * frameW;
  const sy = 0;

  ctx.save();

  if (player.facing === -1) {
    ctx.translate(player.x - cameraX + player.w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      0, player.y, player.w, player.h
    );
  } else {
    ctx.drawImage(
      character,
      sx, sy, frameW, frameH,
      player.x - cameraX, player.y, player.w, player.h
    );
  }

  ctx.restore();

  if (finished) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "white";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("복도 끝에 도착했다!", W / 2, H / 2);
    ctx.textAlign = "left";
  }
}

function loop(time) {
  const dt = lastTime ? time - lastTime : 16.67;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
