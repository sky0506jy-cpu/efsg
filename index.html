
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야자 탈출</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101525;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#help{position:fixed;top:10px;left:10px;z-index:2;background:#000c;color:white;padding:10px 13px;border-radius:10px;line-height:1.5;font-size:14px;pointer-events:none}
#nextFloor{display:none;position:fixed;right:12px;top:12px;z-index:3;padding:12px 16px;border:0;border-radius:10px;background:#ffd34e;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="help">
← → / A D : 이동<br>
Space / ↑ / W : 점프<br>
장애물에 닿으면 목숨 감소<br>
목숨 3개 소진 시 현재 층 재시작
</div>
<button id="nextFloor">다음 층으로 ▶</button>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const nextButton=document.getElementById('nextFloor');

const school=new Image();
const character=new Image();
const assets=new Image();

school.src='./school.png';
character.src='./character.png';
assets.src='./assets.png';

let W=innerWidth,H=innerHeight,dpr=1;
let ready=false,finished=false;
let currentFloor=4,lives=3,cameraX=0,lastTime=0;
let MAP_SCALE=3.5,mapY=0,mapWidth=0,floorY=0;
let platforms=[],hazards=[],movingPlatforms=[];

const player={
 x:40,y:0,w:58,h:78,
 speed:5.5,jumpPower:16.5,vy:0,
 onGround:false,facing:1,invuln:0,frame:0,anim:0
};

const SPR={
 long:   {x:16,y:108,w:294,h:72},
 medium: {x:331,y:108,w:131,h:72},
 small:  {x:487,y:108,w:64,h:72},
 block:  {x:571,y:94,w:106,h:88},
 wide:   {x:697,y:109,w:153,h:72},

 spikes: {x:1264,y:276,w:110,h:68},
 ceiling:{x:797,y:408,w:160,h:74},
 redLaser:{x:958,y:416,w:168,h:66},
 verticalLaser:{x:1137,y:403,w:94,h:145},
 saw:{x:1267,y:431,w:91,h:87},
 blueLaser:{x:1373,y:421,w:135,h:111}
};

const resize=()=>{
 W=innerWidth;
 H=innerHeight;
 dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);

 if(school.naturalWidth&&character.naturalWidth){
  MAP_SCALE=3.5;
  mapWidth=Math.max(W+1,school.naturalWidth*MAP_SCALE);
  mapY=H*-0.65;
  floorY=H*.80;
 }
};

const setup=(reset=true)=>{
 if(!school.naturalWidth||!character.naturalWidth)return;

 MAP_SCALE=3.5;
 mapWidth=Math.max(W+1,school.naturalWidth*MAP_SCALE);

 // 배경을 크게 유지하되 바닥과 게임 화면은 아래에 가려지지 않도록 배치
 mapY=H*-0.65;
 floorY=H*.80;

 if(reset){
  generateLevel();
  resetPlayer();
 }
 ready=true;
};

const generateLevel=()=>{
 platforms=[];
 hazards=[];
 movingPlatforms=[];

 // 오브젝트 수를 크게 늘림
 const total=48+(4-currentFloor)*16;
 const spacing=(mapWidth-380)/total;

 for(let i=0;i<total;i++){
  const x=150+i*spacing;
  const variant=i%5;
  let type='medium',w=112;

  if(variant===0){type='long';w=170}
  if(variant===1){type='medium';w=112}
  if(variant===2){type='small';w=70}
  if(variant===3){type='block';w=90}
  if(variant===4){type='wide';w=145}

  const height=i%6===0?170:i%3===0?120:75+(i%2)*25;
  const y=floorY-height;

  platforms.push({x,y,w,h:27,type});

  // 바닥 가시
  if(i%2===1||(currentFloor<=2&&i%3===0)){
   hazards.push({
    x:x+w+Math.max(12,spacing*.14),
    y:floorY-34,w:58,h:34,type:'spikes'
   });
  }

  // 발판 주변의 가시
  if(currentFloor<=3&&i%6===2){
   hazards.push({
    x:x+w+14,y:y-45,w:54,h:34,type:'spikes'
   });
  }

  // 천장 가시
  if(currentFloor<=3&&i%8===4){
   hazards.push({
    x:x+20,y:y-100,w:100,h:48,type:'ceiling'
   });
  }

  // 수평 레이저
  if(currentFloor<=3&&i%9===5){
   hazards.push({
    x:x+w+20,y:y-52,w:100,h:35,type:'redLaser'
   });
  }

  // 수직 레이저와 회전 톱은 최종 층에 추가
  if(currentFloor===1&&i%11===6){
   hazards.push({
    x:x+w+15,y:y-90,w:38,h:78,type:'verticalLaser'
   });
  }

  if(currentFloor===1&&i%10===3){
   hazards.push({
    x:x+w+18,y:y-42,w:44,h:44,type:'saw'
   });
  }

  if(currentFloor===1&&i%12===8){
   hazards.push({
    x:x+w+18,y:y-66,w:76,h:50,type:'blueLaser'
   });
  }
 }

 // 움직이는 발판
 for(let i=0;i<Math.floor(total/5);i++){
  const x=300+i*spacing*5;
  const y=floorY-190-(i%3)*30;

  movingPlatforms.push({
   x,y,baseX:x,baseY:y,w:120,h:27,
   phase:i*1.4,direction:i%2===0?1:-1,
   type:i%2===0?'long':'medium'
  });
 }

 platforms.unshift({
  x:30,y:floorY-60,w:170,h:27,type:'long'
 });

 platforms.push({
  x:mapWidth-205,y:floorY-70,w:170,h:27,type:'long'
 });
};

const resetPlayer=()=>{
 player.x=35;
 player.y=floorY-player.h;
 player.vy=0;
 player.onGround=true;
 player.facing=1;
 player.frame=0;
 player.anim=0;
 player.invuln=1000;
 cameraX=0;
};

school.onload=()=>setup(true);
character.onload=()=>setup(true);
assets.onload=()=>draw();

school.onerror=()=>console.error('school.png 파일을 확인해 주세요.');
character.onerror=()=>console.error('character.png 파일을 확인해 주세요.');
assets.onerror=()=>console.error('assets.png 파일을 확인해 주세요.');

window.addEventListener('resize',()=>{
 resize();
 setup(false);
});

resize();

const keys={};

window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)||
 ['KeyA','KeyD','KeyW','Space'].includes(e.code)){
  e.preventDefault();
 }

 const jump=['Space','ArrowUp','KeyW'].includes(e.code);

 if(jump&&!keys[e.code]&&player.onGround&&!finished){
  player.vy=-player.jumpPower;
  player.onGround=false;
 }

 keys[e.code]=true;
 keys[e.key]=true;
});

window.addEventListener('keyup',e=>{
 keys[e.code]=false;
 keys[e.key]=false;
});

window.addEventListener('blur',()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

const hit=(a,b)=>
 a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const loseLife=()=>{
 if(player.invuln>0)return;
 lives--;

 if(lives<=0){
  lives=3;
  generateLevel();
 }

 resetPlayer();
};

const update=(dt)=>{
 if(!ready||finished)return;

 const f=Math.min(dt/16.67,2);
 if(player.invuln>0)player.invuln-=dt;

 const oldX=player.x;

 if(keys.ArrowRight||keys.KeyD||keys.d||keys.D){
  player.x+=player.speed*f;
  player.facing=1;
 }
 if(keys.ArrowLeft||keys.KeyA||keys.a||keys.A){
  player.x-=player.speed*f;
  player.facing=-1;
 }

 player.x=Math.max(0,Math.min(mapWidth-player.w,player.x));

 const previousBottom=player.y+player.h;
 player.vy+=.58*f;
 player.y+=player.vy*f;
 player.onGround=false;

 if(player.y+player.h>=floorY){
  player.y=floorY-player.h;
  player.vy=0;
  player.onGround=true;
 }

 platforms.forEach(p=>{
  if(player.vy>=0&&player.x+player.w-7>p.x&&
     player.x+7<p.x+p.w&&previousBottom<=p.y+14&&
     player.y+player.h>=p.y){
   player.y=p.y-player.h;
   player.vy=0;
   player.onGround=true;
  }
 });

 const now=performance.now();

 movingPlatforms.forEach(p=>{
  p.y=p.baseY+Math.sin(now/430+p.phase)*25;
  p.x+=p.direction*.4*f;

  if(p.x<p.baseX-55||p.x>p.baseX+55)p.direction*=-1;

  if(player.vy>=0&&player.x+player.w-7>p.x&&
     player.x+7<p.x+p.w&&previousBottom<=p.y+14&&
     player.y+player.h>=p.y){
   player.y=p.y-player.h;
   player.vy=0;
   player.onGround=true;
  }
 });

 if(player.invuln<=0){
  const body={
   x:player.x+10,y:player.y+8,
   w:player.w-20,h:player.h-13
  };

  hazards.some(h=>{
   const box={
    x:h.x+7,y:h.y+6,
    w:Math.max(8,h.w-14),h:Math.max(8,h.h-10)
   };

   if(hit(body,box)){
    loseLife();
    return true;
   }
   return false;
  });
 }

 if(Math.abs(player.x-oldX)>.1&&player.onGround){
  player.anim+=dt;
  if(player.anim>105){
   player.frame=(player.frame+1)%4;
   player.anim=0;
  }
 }else if(!player.onGround){
  player.frame=2;
 }else{
  player.frame=0;
 }

 cameraX=Math.max(0,Math.min(player.x-W*.32,mapWidth-W));

 if(player.x>=mapWidth-player.w-2){
  finished=true;
  nextButton.style.display='block';
  nextButton.textContent=currentFloor>1?
   '다음 층으로 내려가기 ▶':'🎉 탈출 완료! 다시 하기';
 }
};

const drawSprite=(name,x,y,w,h)=>{
 const s=SPR[name];

 if(!s||!assets.complete||!assets.naturalWidth)return false;

 ctx.drawImage(
  assets,s.x,s.y,s.w,s.h,
  Math.round(x-cameraX),Math.round(y),w,h
 );
 return true;
};

const drawPlatform=(p)=>{
 if(drawSprite(p.type,p.x,p.y,p.w,p.h))return;

 ctx.fillStyle='#3478c7';
 ctx.fillRect(p.x-cameraX,p.y,p.w,p.h);
 ctx.fillStyle='#9acaff';
 ctx.fillRect(p.x-cameraX,p.y,p.w,4);
};

const drawHazard=(h)=>{
 if(drawSprite(h.type,h.x,h.y,h.w,h.h))return;

 ctx.fillStyle='#ff334f';
 ctx.fillRect(h.x-cameraX,h.y,h.w,h.h);
};

const draw=()=>{
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#101525';
 ctx.fillRect(0,0,W,H);

 if(!ready){
  ctx.fillStyle='white';
  ctx.font='18px sans-serif';
  ctx.fillText('이미지를 불러오는 중...',20,60);
  return;
 }

 // 원래 큰 맵 스케일 유지. 배경만 화면에 맞춰 세로로 표시
 const bgW=school.naturalWidth*MAP_SCALE;
 const bgH=school.naturalHeight*MAP_SCALE;

 for(let x=0;x<mapWidth;x+=bgW){
  ctx.drawImage(
   school,
   x-cameraX,
   mapY,
   bgW,
   bgH
  );
 }

 // 바닥과 HUD가 화면 밖으로 내려가지 않게 고정
 ctx.fillStyle='#101525';
 ctx.fillRect(0,floorY,W,H-floorY);
 ctx.fillStyle='#26324b';
 ctx.fillRect(0,floorY-8,W,10);

 platforms.forEach(p=>{
  if(p.x-cameraX<W+200&&p.x-cameraX+p.w>-200)drawPlatform(p);
 });

 movingPlatforms.forEach(p=>{
  if(p.x-cameraX<W+150&&p.x-cameraX+p.w>-150)drawPlatform(p);
 });

 hazards.forEach(h=>{
  if(h.x-cameraX<W+160&&h.x-cameraX+h.w>-160)drawHazard(h);
 });

 const px=player.x-cameraX;
 const fw=character.naturalWidth/4;
 const fh=character.naturalHeight/2;
 const sx=(player.frame%4)*fw;

 ctx.save();

 if(player.invuln>0&&Math.floor(player.invuln/90)%2===0){
  ctx.globalAlpha=.45;
 }

 if(player.facing<0){
  ctx.translate(px+player.w,0);
  ctx.scale(-1,1);
  ctx.drawImage(character,sx,0,fw,fh,0,player.y,player.w,player.h);
 }else{
  ctx.drawImage(character,sx,0,fw,fh,px,player.y,player.w,player.h);
 }

 ctx.restore();

 // 코인과 체크포인트 깃발 표시 없음
 ctx.fillStyle='#000c';
 ctx.fillRect(12,110,210,68);

 ctx.fillStyle='white';
 ctx.font='bold 20px sans-serif';
 ctx.fillText(`야자 탈출 - ${currentFloor}층`,22,138);

 ctx.font='22px sans-serif';
 ctx.fillStyle='#ff5c72';
 ctx.fillText('❤️'.repeat(lives),22,166);

 if(finished){
  ctx.fillStyle='#000c';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='white';
  ctx.textAlign='center';
  ctx.font='bold 28px sans-serif';
  ctx.fillText(
   currentFloor>1?
   `${currentFloor}층 통과! 다음 층으로 내려가자!`:
   '🎉 1층 탈출 성공! 야자 탈출 완료!',
   W/2,H/2
  );
  ctx.textAlign='left';
 }
};

nextButton.addEventListener('click',()=>{
 currentFloor=currentFloor>1?currentFloor-1:4;
 lives=3;
 finished=false;
 nextButton.style.display='none';
 generateLevel();
 resetPlayer();
});

let loop;
loop=(t)=>{
 const dt=lastTime?Math.min(t-lastTime,40):16.67;
 lastTime=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
};

requestAnimationFrame(loop);
</script>
</body>
</html>
